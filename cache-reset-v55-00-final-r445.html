<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Очистка Control — R445</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:#050607;
      color:#eef8ff;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif
    }
    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:20px
    }
    .box{
      width:min(92vw,580px);
      padding:26px;
      border:1px solid #2f6a56;
      border-radius:26px;
      background:#07131c;
      text-align:center;
      box-shadow:0 24px 70px #000,0 0 32px rgba(73,255,154,.12)
    }
    .badge{
      display:inline-flex;
      padding:7px 12px;
      border:1px solid rgba(111,255,179,.38);
      border-radius:999px;
      background:rgba(16,71,48,.45);
      color:#caffdd;
      font-weight:900;
      font-size:.78rem;
      letter-spacing:.08em
    }
    h1{
      margin:16px 0 8px;
      font-size:clamp(27px,7vw,42px);
      line-height:1.08
    }
    p{
      margin:8px auto;
      color:#b7c9d2;
      line-height:1.45;
      max-width:490px
    }
    .bar{
      height:11px;
      margin:22px 0 15px;
      border-radius:99px;
      background:#0b2634;
      overflow:hidden
    }
    .bar span{
      display:block;
      width:3%;
      height:100%;
      background:linear-gradient(90deg,#4adf93,#8eeeff);
      transition:width .28s ease
    }
    .steps{
      margin:14px 0 0;
      display:grid;
      gap:9px;
      text-align:left
    }
    .step{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid rgba(132,197,221,.12);
      border-radius:14px;
      background:rgba(2,10,16,.45);
      color:#8fa6b2
    }
    .step .dot{
      width:11px;
      height:11px;
      flex:0 0 11px;
      border-radius:50%;
      background:#334a57;
      box-shadow:0 0 0 4px rgba(51,74,87,.12)
    }
    .step.run{
      color:#d9f7ff;
      border-color:rgba(105,226,255,.26)
    }
    .step.run .dot{
      background:#6ee7ff;
      box-shadow:0 0 12px rgba(110,231,255,.75)
    }
    .step.done{
      color:#c9ffdc;
      border-color:rgba(91,255,163,.25)
    }
    .step.done .dot{
      background:#55ef9a;
      box-shadow:0 0 12px rgba(85,239,154,.72)
    }
    .result{
      min-height:24px;
      margin-top:16px;
      color:#9eb4bf;
      font-size:.92rem
    }
    .result.ok{
      color:#bfffd9;
      font-weight:850
    }
    .btn{
      display:none;
      align-items:center;
      justify-content:center;
      width:100%;
      margin-top:18px;
      padding:15px 20px;
      border:1px solid rgba(111,255,179,.45);
      border-radius:999px;
      background:#0e4430;
      color:#e7fff1;
      text-decoration:none;
      font-weight:900;
      font-size:1.04rem
    }
    .btn.show{display:flex}
    .small{
      font-size:.76rem;
      color:#718b98;
      margin-top:12px
    }
  </style>
</head>
<body>
  <main class="box">
    <span class="badge">СТРАНИЦА ОЧИСТКИ R445</span>
    <h1 id="title">Чистим кэш Control</h1>
    <p id="status">Не закрывай страницу. После завершения появится кнопка открытия Control.</p>

    <div class="bar"><span id="bar"></span></div>

    <div class="steps">
      <div class="step" id="stepCaches"><span class="dot"></span><span>Удаление сохранённых кэшей</span></div>
      <div class="step" id="stepWorkers"><span class="dot"></span><span>Остановка старого Service Worker</span></div>
      <div class="step" id="stepNetwork"><span class="dot"></span><span>Загрузка свежих файлов с сервера</span></div>
    </div>

    <div class="result" id="result">Подготовка…</div>

    <a class="btn" id="open" href="/control-home.html?page=menu&v=55.00-r445">Открыть Control</a>
    <div class="small">Автоматического перехода больше нет.</div>
  </main>

<script>
(async()=>{
  'use strict';

  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const bar=document.getElementById('bar');
  const result=document.getElementById('result');
  const title=document.getElementById('title');
  const open=document.getElementById('open');
  const stamp=Date.now();
  const target='/control-home.html?page=menu&v=55.00-r445&fresh='+stamp;

  const step=id=>document.getElementById(id);
  const run=id=>{
    const el=step(id);
    el.classList.remove('done');
    el.classList.add('run');
  };
  const done=id=>{
    const el=step(id);
    el.classList.remove('run');
    el.classList.add('done');
  };

  let deletedCaches=0;
  let removedWorkers=0;

  try{
    run('stepCaches');
    bar.style.width='18%';
    await sleep(350);

    if('caches' in window){
      const names=await caches.keys();
      const results=await Promise.all(
        names.map(name=>caches.delete(name).catch(()=>false))
      );
      deletedCaches=results.filter(Boolean).length;
    }

    done('stepCaches');
    run('stepWorkers');
    bar.style.width='48%';
    await sleep(350);

    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations().catch(()=>[]);

      for(const registration of registrations){
        const url=String(
          registration.active?.scriptURL ||
          registration.waiting?.scriptURL ||
          registration.installing?.scriptURL ||
          ''
        );

        // OneSignal push must remain registered.
        if(/OneSignalSDK|\/push\/onesignal\//i.test(url)) continue;

        try{
          registration.active?.postMessage({type:'CLEAR_ALL_CACHES'});
          registration.waiting?.postMessage({type:'CLEAR_ALL_CACHES'});
        }catch(_){}

        const removed=await registration.unregister().catch(()=>false);
        if(removed) removedWorkers++;
      }
    }

    done('stepWorkers');
    run('stepNetwork');
    bar.style.width='76%';
    await sleep(450);

    // Warm fresh copies without using browser HTTP cache.
    const freshUrls=[
      '/control-home.html?cache-bust='+stamp,
      '/analytics-admin.html?cache-bust='+stamp,
      '/service-admin.html?cache-bust='+stamp,
      '/site-update-admin.html?cache-bust='+stamp,
      
      '/assets/country-map-r352.css?cache-bust='+stamp,
      '/assets/country-map-r352.js?cache-bust='+stamp,
      '/assets/map-visual-r354.css?cache-bust='+stamp,
      '/assets/map-layer-color-r354.js?cache-bust='+stamp,
      '/assets/country-list-scroll-r354.css?cache-bust='+stamp,
      '/assets/country-list-scroll-r354.js?cache-bust='+stamp,
      '/assets/control-version-sync-r445.js?cache-bust='+stamp,
      '/assets/album-zip-admin-r445.js?cache-bust='+stamp,
      '/assets/album-zip-admin-r445.css?cache-bust='+stamp,
      '/assets/albums-r445.css?cache-bust='+stamp,
      '/assets/albums-r445.js?cache-bust='+stamp,
      '/albums.html?cache-bust='+stamp,
      '/assets/admin-home-hub-r423.css?cache-bust='+stamp,
      '/assets/admin-home-balance-r445.css?cache-bust='+stamp,
      '/assets/planet-map-transition-r445.css?cache-bust='+stamp,
      '/assets/planet-map-transition-r445.js?cache-bust='+stamp,
      '/assets/admin-home-landscape-scroll-r432.css?cache-bust='+stamp,
      '/assets/admin-home-hub-r418.js?cache-bust='+stamp,
      '/assets/admin-map-entry-r432.js?cache-bust='+stamp,
      '/assets/admin-quick-nav-r423.js?cache-bust='+stamp,
      '/assets/admin-quick-reports-r422.js?cache-bust='+stamp,
      '/assets/landscape-world-scroll-r432.css?cache-bust='+stamp,
      '/assets/country-city-history-r419.css?cache-bust='+stamp,
      '/assets/country-city-simple-list-r427.css?cache-bust='+stamp,
      '/assets/country-city-history-r427.js?cache-bust='+stamp,
      '/assets/country-city-simple-list-r438.css?cache-bust='+stamp,
      '/assets/country-city-history-r438.js?cache-bust='+stamp,
      '/assets/singles-r349.js?cache-bust='+stamp,
      '/assets/ecosystem-map-r337.css?cache-bust='+stamp,
      '/assets/ecosystem-map-r347.js?cache-bust='+stamp,
      '/assets/country-activity-r337.js?cache-bust='+stamp,
      '/assets/map-monthly-r337.js?cache-bust='+stamp,
      '/assets/country-focus-compact-r339.css?cache-bust='+stamp,
      '/assets/country-focus-compact-r339.js?cache-bust='+stamp,
      '/assets/country-shapes-r341.js?cache-bust='+stamp,
      '/assets/country-map-r346.css?cache-bust='+stamp,
      '/assets/country-map-r346.js?cache-bust='+stamp,
      '/assets/map-frame-scroll-r351.css?cache-bust='+stamp,
      '/player.html?cache-bust='+stamp,
      '/assets/player-i18n-v51.js?cache-bust='+stamp,
      '/singles.html?cache-bust='+stamp
    ];

    await Promise.allSettled(
      freshUrls.map(url=>fetch(url,{
        method:'GET',
        cache:'no-store',
        credentials:'include',
        headers:{
          'Cache-Control':'no-cache, no-store, max-age=0',
          'Pragma':'no-cache'
        }
      }))
    );

    // R346: activate YouTube WebSub immediately when the owner session is present.
    // If the session is unavailable, the normal central Cron will subscribe automatically.
    await fetch('/api/youtube/websub/subscribe',{
      method:'POST',
      cache:'no-store',
      credentials:'include',
      headers:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}
    }).catch(()=>null);
    // Also run one lightweight release check now, so a release published before
    // R445 installation: clear stale UI/assets and open the current Control build.
    await fetch('/api/automation/youtube-fast',{
      method:'POST',
      cache:'no-store',
      credentials:'include',
      headers:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}
    }).catch(()=>null);
    // Keep the existing lightweight comments/likes self-test from the stable R436 base. This lets a
    // reply missed by the old embedded-replies path be recovered right after install.
    await fetch('/api/automation/youtube-engagement-fast',{
      method:'POST',
      cache:'no-store',
      credentials:'include',
      headers:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}
    }).catch(()=>null);

    done('stepNetwork');
    bar.style.width='100%';
    await sleep(300);

    title.textContent='Кэш очищен';
    result.className='result ok';
    result.textContent=`Готово: удалено кэшей — ${deletedCaches}, остановлено старых Worker — ${removedWorkers}.`;
    open.href=target;
    open.classList.add('show');
  }catch(error){
    console.error(error);
    bar.style.width='100%';
    title.textContent='Очистка завершена';
    result.textContent='Часть браузерных данных могла быть недоступна. Нажми «Открыть Control».';
    open.href=target;
    open.classList.add('show');
  }
})();
</script>
<script defer src="/assets/control-version-sync-r445.js?v=55.00-r445"></script>
<link rel="preload" as="style" href="/assets/map-total-compact-r348.css?cache-bust=1">
</body>
</html>
