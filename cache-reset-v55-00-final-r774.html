<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>ANDRIK R774 — безопасная очистка кэша</title><style>body{margin:0;background:#05070a;color:#fff;font:16px/1.5 system-ui;padding:28px}.w{max-width:680px;margin:auto}.ok{color:#76f2a7}.warn{color:#ffd166}.btn{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:14px;background:#fff;color:#071018;text-decoration:none;font-weight:800}.small{white-space:pre-wrap;opacity:.8}</style></head><body><main class="w"><h2>R774 · очистка без поломки PUSH</h2><p id="s">Очищаю кэш сайта. OneSignal и подписку телефона НЕ удаляю…</p><pre id="d" class="small"></pre><a id="b" class="btn" href="/?r=772" hidden>Открыть ANDRIK</a></main><script>(async()=>{const s=document.getElementById('s'),d=document.getElementById('d'),b=document.getElementById('b'),out=[],note=x=>{out.push(x);d.textContent=out.join('\n')};try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();let kept=0,removed=0;for(const r of regs){const scope=String(r.scope||'');if(scope.includes('/push/onesignal/')){kept++;continue}try{await r.unregister();removed++}catch(_){}}note('✅ Service Worker сайта удалён: '+removed);note('🔔 OneSignal worker сохранён: '+kept)}if('caches'in window){const ks=await caches.keys();let n=0;for(const k of ks){if(/onesignal/i.test(k))continue;try{await caches.delete(k);n++}catch(_){}}note('✅ Cache Storage очищен: '+n)}try{const rm=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(/^andrik-(?:cache|radio-visuals-cache|version|asset-cache)/i.test(k))rm.push(k)}for(const k of rm)localStorage.removeItem(k);note('✅ Локальный кэш ANDRIK очищен: '+rm.length)}catch(_){}if(indexedDB&&indexedDB.databases){try{const dbs=await indexedDB.databases();let n=0;for(const db of dbs||[]){if(!db?.name||/onesignal/i.test(db.name))continue;if(/andrik|control|site/i.test(db.name)){try{indexedDB.deleteDatabase(db.name);n++}catch(_){}}}note('✅ IndexedDB сайта очищен: '+n);note('🔔 OneSignal IndexedDB сохранён')}catch(_){}}try{localStorage.setItem('andrik-cache-reset-r774',String(Date.now()))}catch(_){}s.innerHTML='<span class="ok">✅ R774: кэш очищен, PUSH сохранён.</span>';b.href='/?r=772&t='+Date.now();b.hidden=false}catch(e){s.innerHTML='<span class="warn">⚠ Очистка частичная, но OneSignal не удалялся.</span>';note(String(e));b.hidden=false}})();</script></body></html>
