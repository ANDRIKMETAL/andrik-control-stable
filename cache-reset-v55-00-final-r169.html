<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Очистка кэша — LIVE WEB AI R169</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050607;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:20px}
    .box{width:min(94vw,650px);padding:26px;border:1px solid #2f6a56;border-radius:26px;background:#07131c;text-align:center;box-shadow:0 24px 70px #000,0 0 32px rgba(73,255,154,.12)}
    .badge{display:inline-flex;padding:7px 12px;border:1px solid rgba(111,255,179,.38);border-radius:999px;background:rgba(16,71,48,.45);color:#caffdd;font-weight:900;font-size:.78rem;letter-spacing:.08em}
    h1{margin:14px 0 8px;font-size:clamp(26px,7vw,42px);line-height:1}
    p{margin:8px auto;color:#a9c0cd;line-height:1.5;max-width:560px}
    .bar{height:10px;margin:18px 0;border-radius:99px;background:#0b2634;overflow:hidden}
    .bar span{display:block;width:3%;height:100%;background:linear-gradient(90deg,#4adf93,#8eeeff);transition:width .22s ease}
    .ok{color:#bfffd9!important;font-weight:800}
    .err{color:#ffd0a8!important}
    .btn{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;padding:13px 20px;border:1px solid rgba(111,255,179,.38);border-radius:999px;background:#0e4430;color:#e7fff1;text-decoration:none;font-weight:900}
    .btn[hidden]{display:none}
    code{display:block;margin-top:12px;color:#7fa0ae;font-size:.72rem;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main class="box">
    <span class="badge">СТРАНИЦА ОЧИСТКИ R169</span>
    <h1>Чистим кэш Control</h1>
    <p id="status">Запускаю полную очистку старой версии…</p>
    <div class="bar"><span id="bar"></span></div>
    <a class="btn" id="open" hidden>Открыть Control R169</a>
    <code id="debug"></code>
  </main>
  <script>
  (() => {
    'use strict';
    const status = document.getElementById('status');
    const bar = document.getElementById('bar');
    const open = document.getElementById('open');
    const debug = document.getElementById('debug');
    const stamp = Date.now();
    const target = '/control-home.html?page=menu&v=55.00-r169&fresh=' + stamp;

    const step = (n, text) => {
      status.textContent = n + '/6 · ' + text;
      bar.style.width = (n / 6 * 100) + '%';
    };

    const verifyText = async (url, marker) => {
      const response = await fetch(url + (url.includes('?') ? '&' : '?') + 'probe=' + stamp, {
        cache: 'no-store',
        headers: {'Cache-Control':'no-cache'}
      });
      if (!response.ok) throw new Error(url + ' → HTTP ' + response.status);
      const text = await response.text();
      if (!text.includes(marker)) throw new Error(url + ' открыл старую страницу или fallback');
      return true;
    };

    (async () => {
      try {
        step(1, 'Удаляем Cache Storage…');
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name).catch(() => false)));
        }

        step(2, 'Отключаем старый Service Worker…');
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations().catch(() => []);
          for (const reg of regs) {
            const url = String(reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '');
            if (/OneSignalSDK|\/push\/onesignal\//i.test(url)) continue;
            await reg.unregister().catch(() => false);
          }
        }

        step(3, 'Очищаем сетевой кэш браузера…');
        await fetch('/control-home.html?cache-bust=' + stamp, {cache:'reload'}).catch(() => null);

        step(4, 'Проверяем настоящую R169, а не старый сайт…');
        await verifyText('/analytics-admin.html', 'r169-map-black-strip-final');

        step(5, 'Проверяем обязательные файлы полной сборки…');
        const required=await Promise.all(['/service-worker.js','/_worker.js'].map(url=>fetch(url+'?probe='+stamp,{cache:'no-store'})));
        if(required.some(response=>!response.ok)) throw new Error('Обязательные файлы полной сборки не опубликованы');

        step(6, 'Готово');
        status.className = 'ok';
        status.textContent = 'Кэш очищен. Сервер отдаёт R169 без чёрной полосы под картой.';
        open.href = target;
        open.hidden = false;
        debug.textContent = 'Проверка: ' + new Date().toLocaleString();
      } catch (error) {
        console.error(error);
        status.className = 'err';
        status.textContent = 'Кэш очищен, но сервер пока отдаёт старую версию. Не открывай Control — сначала дождись завершения Deploy.';
        bar.style.width = '100%';
        debug.textContent = String(error && error.message ? error.message : error);
        open.href = target;
        open.textContent = 'Открыть всё равно';
        open.hidden = false;
      }
    })();
  })();
  </script>
</body>
</html>
