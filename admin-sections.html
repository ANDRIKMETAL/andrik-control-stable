<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070b;color:#eaf7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
.admin-carousel{position:absolute;inset:0;overflow:hidden;background:#02070b}
.admin-carousel-track{display:flex;width:100%;height:100%;transform:translate3d(-100vw,0,0);will-change:auto;touch-action:none;backface-visibility:hidden;transform-style:preserve-3d}
.admin-carousel-track.is-dragging{transition:none!important;will-change:transform}
.admin-carousel-track.is-animating{transition:transform .26s cubic-bezier(.22,.78,.23,1);will-change:transform}
.admin-carousel-pane{position:relative;flex:0 0 100%;width:100%;min-width:100%;max-width:100%;height:100%;overflow:hidden;background:#02070b;contain:layout paint size style;backface-visibility:hidden;transform:translateZ(0)}.admin-carousel-pane::before{content:none!important;display:none!important}.admin-carousel-pane iframe{position:relative;left:0;z-index:1}
.admin-carousel-pane iframe{display:block;width:100%;height:100%;border:0;background:#02070b;backface-visibility:hidden;transform:translateZ(0)}
.admin-carousel-pane:not(.is-near) iframe{visibility:hidden!important;pointer-events:none!important}
.admin-carousel-pane.is-near iframe{visibility:visible!important}
.admin-carousel-pane:not(.is-active) iframe{pointer-events:none!important}
.admin-carousel-pane.is-active iframe{pointer-events:auto!important}
body.is-carousel-moving .control-admin-landscape-frame-r141{animation-play-state:paused!important;filter:none!important}
body.is-carousel-moving .admin-carousel-label{backdrop-filter:none!important}
.admin-carousel-dots{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));z-index:20;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid rgba(126,198,230,.18);border-radius:999px;background:rgba(4,13,20,.82);backdrop-filter:blur(14px)}
.admin-carousel-dots button{appearance:none;width:10px;height:10px;padding:0;border:0;border-radius:50%;background:#526576;opacity:.72;transition:width .2s ease,background .2s ease,opacity .2s ease}
.admin-carousel-dots button.is-active{width:35px;border-radius:999px;background:#79def9;opacity:1;box-shadow:0 0 15px rgba(121,222,249,.55)}
.admin-carousel-label{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));z-index:21;transform:translate(-50%,-16px);opacity:0;pointer-events:none;padding:9px 14px;border:1px solid rgba(126,198,230,.2);border-radius:999px;background:rgba(4,13,20,.9);color:#eaf8ff;font-weight:850;font-size:.82rem;transition:opacity .18s ease,transform .18s ease;backdrop-filter:blur(14px)}
.admin-carousel-label.is-visible{opacity:1;transform:translate(-50%,0)}
.admin-carousel-loading{position:absolute;inset:0;display:grid;place-items:center;color:#92aab7;font-size:.9rem;pointer-events:none}
@media(prefers-reduced-motion:reduce){.admin-carousel-track.is-animating{transition-duration:.01ms}.admin-carousel-dots button,.admin-carousel-label{transition:none}}
</style>

<body class="admin-sections-shell">
<div class="control-admin-landscape-frame-r141" aria-hidden="true"></div>
<main class="admin-carousel" aria-label="Разделы админ-панели">
  <div class="admin-carousel-track" id="adminCarouselTrack">
    <section class="admin-carousel-pane" data-physical="0" data-section="discussion"><div class="admin-carousel-loading">Загружаем обсуждение…</div><iframe title="Обсуждение — копия для кругового перехода" data-section="discussion" data-src="/comments-admin.html?embed=1&v=55.00-r214"></iframe></section>
    <section class="admin-carousel-pane" data-physical="1" data-section="service"><div class="admin-carousel-loading">Загружаем служебное…</div><iframe title="Служебное" data-section="service" data-src="/service-admin.html?embed=1&v=55.00-r214"></iframe></section>
    <section class="admin-carousel-pane" data-physical="2" data-section="monitor"><div class="admin-carousel-loading">Загружаем мониторинг…</div><iframe title="Мониторинг" data-section="monitor" data-src="/observability-admin.html?embed=1&v=55.00-r214"></iframe></section>
    <section class="admin-carousel-pane" data-physical="3" data-section="releases"><div class="admin-carousel-loading">Загружаем релизы…</div><iframe title="Релизы" data-section="releases" data-src="/lyrics-admin.html?embed=1&v=55.00-r214"></iframe></section>
    <section class="admin-carousel-pane" data-physical="4" data-section="discussion"><div class="admin-carousel-loading">Загружаем обсуждение…</div><iframe title="Обсуждение" data-section="discussion" data-src="/comments-admin.html?embed=1&v=55.00-r214"></iframe></section>
    <section class="admin-carousel-pane" data-physical="5" data-section="service"><div class="admin-carousel-loading">Загружаем служебное…</div><iframe title="Служебное — копия для кругового перехода" data-section="service" data-src="/service-admin.html?embed=1&v=55.00-r214"></iframe></section>
  </div>
</main>
<nav class="admin-carousel-dots" aria-label="Разделы">
  <button type="button" data-logical="0" aria-label="Служебное"></button>
  <button type="button" data-logical="1" aria-label="Мониторинг"></button>
  <button type="button" data-logical="2" aria-label="Релизы"></button>
  <button type="button" data-logical="3" aria-label="Обсуждение"></button>
</nav>
<div class="admin-carousel-label" id="adminCarouselLabel" aria-live="polite"></div>
<script>
(() => {
  'use strict';

  const VERSION='55.00-r214';
  const CHILD_CHANNEL='andrik-admin-carousel-control';

  const sections=[
    {key:'service',name:'Служебное'},
    {key:'monitor',name:'Мониторинг'},
    {key:'releases',name:'Релизы'},
    {key:'discussion',name:'Обсуждение'}
  ];

  const track=document.getElementById('adminCarouselTrack');
  const panes=[...track.children];
  const frames=panes.map(pane=>pane.querySelector('iframe'));
  const dots=[...document.querySelectorAll('[data-logical]')];
  const label=document.getElementById('adminCarouselLabel');

  const initialKey=(new URLSearchParams(location.search).get('section')||'service').toLowerCase();

  let logical=Math.max(0,sections.findIndex(item=>item.key===initialKey));
  if(logical<0)logical=0;

  let physical=logical+1;
  let dragging=false;
  let animating=false;
  let dragX=0;
  let labelTimer=0;
  let previewLogical=-1;

  const scrollStates=new Map();

  const width=()=>Math.max(
    1,
    track.parentElement?.clientWidth ||
    window.innerWidth ||
    document.documentElement.clientWidth ||
    1
  );

  const sendToFrame=(frame,payload)=>{
    try{
      frame?.contentWindow?.postMessage({
        channel:CHILD_CHANNEL,
        ...payload
      },location.origin);
    }catch(_){}
  };

  const applyScrollStateToFrame=(frame,section)=>{
    if(!section||!scrollStates.has(section))return;
    sendToFrame(frame,{
      type:'apply-scroll-state',
      section,
      top:scrollStates.get(section)
    });
  };

  const syncSectionClones=(section,sourceWindow)=>{
    if(!section||!scrollStates.has(section))return;
    frames.forEach(frame=>{
      if(frame?.dataset?.section!==section)return;
      if(frame.contentWindow===sourceWindow)return;
      applyScrollStateToFrame(frame,section);
    });
  };

  const updatePaneVisibility=()=>{
    const near=new Set([
      Math.max(0,physical-1),
      physical,
      Math.min(panes.length-1,physical+1)
    ]);

    panes.forEach((pane,index)=>{
      pane.classList.toggle('is-near',near.has(index));
      pane.classList.toggle('is-active',index===physical);
      pane.setAttribute('aria-hidden',index===physical?'false':'true');
    });
  };

  const setMoving=active=>{
    document.body.classList.toggle('is-carousel-moving',Boolean(active));
  };

  const setTransform=(animate=false,x=0)=>{
    track.classList.toggle('is-animating',animate);
    track.classList.toggle('is-dragging',!animate&&dragging);
    track.style.transform=`translate3d(${-(physical*width())+x}px,0,0)`;
  };

  const updateUi=()=>{
    const activeSection=sections[logical]?.key||'service';

    document.body.dataset.activeSection=activeSection;

    dots.forEach((dot,index)=>{
      dot.classList.toggle('is-active',index===logical);
    });

    document.title=`Live Web AI — ${sections[logical].name}`;

    const url=new URL(location.href);
    url.searchParams.set('section',activeSection);
    url.searchParams.set('v',VERSION);
    history.replaceState({section:activeSection},'',url);

    updatePaneVisibility();
    applyScrollStateToFrame(frames[physical],activeSection);
  };

  const showLabel=(name,nextLogical)=>{
    if(previewLogical===nextLogical&&label.classList.contains('is-visible'))return;

    previewLogical=nextLogical;
    label.textContent=name;
    label.classList.add('is-visible');

    clearTimeout(labelTimer);
    labelTimer=setTimeout(()=>{
      label.classList.remove('is-visible');
      previewLogical=-1;
    },520);
  };

  const finishMotion=()=>{
    dragging=false;
    animating=false;
    dragX=0;
    previewLogical=-1;
    track.classList.remove('is-animating','is-dragging');
    setMoving(false);
  };

  const snapAfterEdge=()=>{
    if(physical===0){
      physical=4;
      logical=3;
      setTransform(false,0);
    }else if(physical===5){
      physical=1;
      logical=0;
      setTransform(false,0);
    }else{
      logical=physical-1;
    }

    finishMotion();
    updateUi();
  };

  const moveRelative=direction=>{
    if(animating||!direction)return;

    animating=true;
    dragging=false;
    dragX=0;
    setMoving(true);

    physical+=direction;
    updatePaneVisibility();

    const preview=(logical+direction+sections.length)%sections.length;
    const previewSection=sections[preview].key;

    applyScrollStateToFrame(frames[physical],previewSection);
    showLabel(sections[preview].name,preview);
    setTransform(true,0);

    window.setTimeout(snapAfterEdge,285);
  };

  const moveToLogical=index=>{
    if(animating||index===logical)return;

    const forward=(index-logical+4)%4;
    const backward=(logical-index+4)%4;

    moveRelative(forward<=backward?1:-1);
  };

  const cancelDrag=()=>{
    if(animating)return;

    const moved=Math.abs(dragX);
    dragging=false;
    dragX=0;

    if(moved<2){
      setTransform(false,0);
      finishMotion();
      return;
    }

    animating=true;
    setMoving(true);
    setTransform(true,0);

    window.setTimeout(()=>{
      finishMotion();
      updatePaneVisibility();
    },270);
  };

  window.addEventListener('message',event=>{
    if(event.origin!==location.origin)return;

    const data=event.data||{};
    if(data.channel!=='andrik-admin-carousel')return;

    const sourceIndex=frames.findIndex(frame=>frame.contentWindow===event.source);
    if(sourceIndex<0)return;

    const sourceFrame=frames[sourceIndex];
    const sourceSection=sourceFrame?.dataset?.section||'';

    if(data.type==='scroll-state'){
      if(event.source!==frames[physical]?.contentWindow)return;

      const top=Math.max(0,Number(data.top)||0);
      const section=data.section||sourceSection;

      scrollStates.set(section,top);
      syncSectionClones(section,event.source);
      return;
    }

    if(data.type==='frame-ready'){
      applyScrollStateToFrame(sourceFrame,data.section||sourceSection);
      return;
    }

    const activeFrame=frames[physical];
    if(event.source!==activeFrame?.contentWindow)return;

    if(data.type==='gesture-start'&&!animating){
      dragging=true;
      dragX=0;
      setMoving(true);
      track.classList.add('is-dragging');
      return;
    }

    if(data.type==='gesture-move'&&dragging&&!animating){
      dragX=Math.max(
        -width()*.92,
        Math.min(width()*.92,Number(data.dx)||0)
      );

      const preview=(logical+(dragX<0?1:-1)+4)%4;
      showLabel(sections[preview].name,preview);
      setTransform(false,dragX);
      return;
    }

    if(data.type==='gesture-commit'&&dragging&&!animating){
      dragging=false;
      moveRelative(Number(data.direction)||0);
      return;
    }

    if(data.type==='gesture-cancel'&&dragging&&!animating){
      cancelDrag();
      return;
    }

    if(data.type==='navigate-section'){
      const index=sections.findIndex(item=>item.key===data.section);
      if(index>=0)moveToLogical(index);
    }
  });

  dots.forEach(dot=>{
    dot.addEventListener('click',()=>{
      moveToLogical(Number(dot.dataset.logical));
    });
  });

  window.addEventListener('resize',()=>{
    setTransform(false,0);
    updatePaneVisibility();
  });

  window.addEventListener('popstate',()=>{
    const key=(new URLSearchParams(location.search).get('section')||'service').toLowerCase();
    const index=sections.findIndex(item=>item.key===key);

    if(index>=0&&index!==logical){
      logical=index;
      physical=index+1;
      setTransform(false,0);
      finishMotion();
      updateUi();
    }
  });

  frames.forEach((frame,index)=>{
    frame.addEventListener('load',()=>{
      panes[index].querySelector('.admin-carousel-loading')?.remove();
      applyScrollStateToFrame(frame,frame.dataset.section||'');
    },{once:true});

    frame.src=frame.dataset.src;
  });

  setTransform(false,0);
  updateUi();

  window.__ANDRIK_ADMIN_CAROUSEL_TEST__={
    getState:()=>({
      logical,
      physical,
      key:sections[logical].key,
      animating,
      dragging,
      dragX,
      transform:track.style.transform,
      moving:document.body.classList.contains('is-carousel-moving'),
      scrollStates:Object.fromEntries(scrollStates)
    }),
    next:()=>moveRelative(1),
    prev:()=>moveRelative(-1),
    go:index=>moveToLogical(Number(index))
  };
})();
</script>
