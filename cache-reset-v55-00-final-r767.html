<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANDRIK R767 cache reset</title></head><body style="background:#05070a;color:#fff;font-family:system-ui;padding:24px"><h2>R767 · очистка кэша</h2><p id="s">Очищаю…</p><script>(async()=>{const a=[];try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){await r.unregister();a.push('service worker')}}if('caches'in window){const ks=await caches.keys();for(const k of ks){await caches.delete(k);a.push('cache '+k)}}try{localStorage.clear();a.push('localStorage')}catch(e){}try{sessionStorage.clear();a.push('sessionStorage')}catch(e){}document.getElementById('s').innerHTML='✅ R767 очищен.<br><br>'+a.map(x=>'• '+x).join('<br>')+'<br><br>Теперь закрой эту вкладку и заново открой сайт.'}catch(e){document.getElementById('s').textContent='⚠️ '+e}})();</script></body></html>
