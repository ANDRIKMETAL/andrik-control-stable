<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ANDRIK · VPS Backup</title><script defer src="/assets/owner-session-r197.js?v=55.00-r471"></script><style>body{margin:0;background:#07110f;color:#eef7f3;font:16px system-ui}.w{max-width:760px;margin:auto;padding:24px}.card{background:#101b19;border:1px solid #28443d;border-radius:20px;padding:22px;margin:16px 0}a{color:#9fe6cf}.ok{color:#76f0ba}.bad{color:#ff8c96}button{padding:13px 18px;border:0;border-radius:12px;font-weight:800}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #38534d;background:#08100f;color:white;margin:8px 0}code{word-break:break-all}.bar{height:12px;background:#22322e;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#8dddc4}</style></head><body><div class="w"><a href="/control-home.html">← Control</a><div class="card"><h1>🔐 VPS BACKUP → R2</h1><p>Приватная аварийная копия: <code>vps-backups/ANDRIK-TRANSFER-2026-09-17.tar.gz</code>.</p><p id="st">Проверяю R2…</p><button id="refresh">Проверить backup в R2</button></div><div class="card"><h2>Резервный вариант: загрузить файл</h2><p>Для Rescue используем прямой серверный uploader — телефон не хранит архив. Это поле оставлено только как запасной способ.</p><input id="file" type="file" accept=".gz,.tgz,.tar.gz"><input id="key" type="password" placeholder="ADMIN_KEY, если Control попросит"><button id="up">Загрузить выбранный архив</button><div class="bar"><i id="b"></i></div><p id="m"></p></div></div><script>
const $=id=>document.getElementById(id);async function token(){return $('key').value.trim()||localStorage.getItem('andrikAdminKey')||''}async function api(url,opt={}){const h=new Headers(opt.headers||{}),k=await token();if(k)h.set('x-admin-key',k);const r=await fetch(url,{...opt,headers:h,credentials:'include'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d}function fmt(n){return n?((n/1024/1024).toFixed(1)+' MB'):'0 MB'}async function status(){try{const d=await api('/api/control/vps-backup-r1030/status');$('st').innerHTML=d.exists?'<span class=ok>BACKUP IN R2: OK ✅</span><br>'+fmt(d.size)+' · '+d.key:'Backup пока отсутствует.'}catch(e){$('st').innerHTML='<span class=bad>'+e.message+'</span>'}}$('refresh').onclick=status;status();$('up').onclick=async()=>{const f=$('file').files[0];if(!f)return;let id='';try{const s=await api('/api/control/vps-backup-r1030/mpu/start',{method:'POST'});id=s.uploadId;const ps=s.partSize||8388608,parts=[];for(let i=0,c=Math.ceil(f.size/ps);i<c;i++){const d=await api('/api/control/vps-backup-r1030/mpu/part?uploadId='+encodeURIComponent(id)+'&partNumber='+(i+1),{method:'PUT',body:f.slice(i*ps,Math.min(f.size,(i+1)*ps))});parts.push({partNumber:d.partNumber,etag:d.etag});const p=Math.round((i+1)/c*100);$('b').style.width=p+'%';$('m').textContent=p+'%'}await api('/api/control/vps-backup-r1030/mpu/complete?uploadId='+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({parts})});$('m').innerHTML='<span class=ok>BACKUP IN R2: OK ✅</span>';await status()}catch(e){$('m').innerHTML='<span class=bad>'+e.message+'</span>';if(id)api('/api/control/vps-backup-r1030/mpu/abort?uploadId='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{})}};</script></body></html>
