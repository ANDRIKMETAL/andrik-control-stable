<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ANDRIK R1238 · очистка</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07131b;color:#eaf7ff;font:17px/1.6 system-ui}main{max-width:560px;margin:20px;padding:28px;border:1px solid #315567;border-radius:20px}a,button{display:inline-block;padding:12px 20px;background:#203f51;color:#fff;border:1px solid #5a899a;border-radius:10px;font:inherit;text-decoration:none}p{color:#bbd2df}</style></head><body><main><h1>ANDRIK · R1238</h1><p id="state" role="status">Очистка старого кэша сайта…</p><p>Сохранения игры, вход в контрольку и подписка на уведомления сохраняются.</p><a href="/dreaming-of-lira.html?v=55.00-r1238">Открыть игру</a> <a href="/?v=55.00-r1238">Главная</a></main><script>
(async()=>{const state=document.getElementById('state');let failed=false;try{if('caches'in window){const keys=await caches.keys();const results=await Promise.allSettled(keys.filter(k=>/^andrik-(site|control)-/i.test(k)).map(k=>caches.delete(k)));failed=results.some(x=>x.status==='rejected');}if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();for(const r of registrations){const worker=r.active||r.waiting||r.installing;if(!worker)continue;const u=new URL(worker.scriptURL);if(u.origin===location.origin&&['/service-worker.js','/control-service-worker.js'].includes(u.pathname)){await Promise.race([r.update().catch(()=>{failed=true}),new Promise(resolve=>setTimeout(()=>{failed=true;resolve()},5000))]);}}}state.textContent=failed?'Кэш очищен частично. Закрой старые вкладки сайта и открой игру по кнопке ниже.':'Готово. Закрой старые вкладки игры и открой обновлённую игру по кнопке ниже.';}catch(e){state.textContent='Браузер ограничил очистку. Закрой старую вкладку и открой игру по кнопке ниже.';}})();
</script></body></html>
