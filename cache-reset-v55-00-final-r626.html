<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANDRIK R626 cache reset</title><body style="background:#05070b;color:#fff;font:16px system-ui;padding:32px"><h1>ANDRIK R626</h1><p id="s">Очищаю кэш…</p><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}sessionStorage.clear();document.getElementById('s').textContent='✅ Кэш очищен. Открываю авторизацию YouTube…';setTimeout(()=>location.replace('/youtube-device-auth-admin.html?r=626&t='+Date.now()),700)}catch(e){document.getElementById('s').textContent='Готово. Откройте страницу авторизации заново.'}})()</script></body></html>
