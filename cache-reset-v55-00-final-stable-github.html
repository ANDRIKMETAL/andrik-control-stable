<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Полная очистка Control — FINAL STABLE GITHUB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050607;color:#eef8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(92vw,560px);padding:28px;border:1px solid #244354;border-radius:26px;background:#07131c;text-align:center;box-shadow:0 24px 70px #000}h1{margin:0 0 12px;font-size:clamp(25px,7vw,40px)}p{color:#a9c0cd;line-height:1.5}.bar{height:10px;margin:18px 0;border-radius:99px;background:#0b2634;overflow:hidden}.bar span{display:block;width:4%;height:100%;background:linear-gradient(90deg,#4adf93,#8eeeff);transition:width .2s ease}.ok{color:#bfffd9}a{display:inline-flex;margin-top:18px;padding:14px 22px;border-radius:999px;background:#0e3448;color:#d9f5ff;text-decoration:none;font-weight:800}</style></head><body><div class="box"><h1>FINAL STABLE GITHUB</h1><p id="status">Запускаем полную очистку Control…</p><div class="bar"><span id="bar"></span></div><a id="open" hidden>Открыть «Последнюю активность»</a></div><script>
(async()=>{
 const status=document.getElementById('status'),bar=document.getElementById('bar'),open=document.getElementById('open');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const step=(n,text)=>{status.textContent=n+'/7 · '+text;bar.style.width=(n/7*100)+'%'};
 const stamp=Date.now();
 const go='/control-home.html?page=activity&v=55.00-final-stable-github&fresh='+stamp;
 try{
  step(1,'Удаляем Cache Storage…');
  if('caches'in window){for(const name of await caches.keys())await caches.delete(name).catch(()=>false)}
  await sleep(160);
  step(2,'Отключаем старые Service Worker…');
  if('serviceWorker'in navigator){for(const reg of await navigator.serviceWorker.getRegistrations().catch(()=>[])){const script=String(reg.active?.scriptURL||reg.waiting?.scriptURL||reg.installing?.scriptURL||'');if(/OneSignalSDK|\/push\/onesignal\//i.test(script))continue;reg.active?.postMessage?.({type:'CLEAR_ALL_CACHES'});reg.waiting?.postMessage?.({type:'CLEAR_ALL_CACHES'});await reg.unregister().catch(()=>false)}}
  await sleep(160);
  step(3,'Очищаем старые runtime-метки…');
  for(const key of Object.keys(localStorage)){if(/andrik-control-(home-last-good|youtube-pane|youtube-monitor|system-cache|runtime-version)/i.test(key))localStorage.removeItem(key)}
  for(const key of Object.keys(sessionStorage)){if(/andrik-control-(runtime-reload|section-entry|reloaded)/i.test(key))sessionStorage.removeItem(key)}
  localStorage.setItem('andrik-control-runtime-version','55.00-final-stable-github');
  await sleep(160);
  step(4,'Загружаем новый экран активности…');
  const page=await fetch('/control-home.html?page=activity&v=55.00-final-stable-github&probe='+stamp,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!page.ok)throw new Error('control-home.html ещё не опубликован');
  step(5,'Проверяем новый исправляющий скрипт…');
  const script=await fetch('/assets/control-home-v55-00-final-stable-github.js?v=55.00-final-stable-github&probe='+stamp,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!script.ok)throw new Error('Новый JS ещё не опубликован');
  step(6,'Фиксируем чистый запуск…');
  sessionStorage.setItem('andrik-control-runtime-reload-final-stable-github','1');
  await sleep(180);
  step(7,'Очистка завершена. Открываем активность…');
  status.classList.add('ok');open.href=go;open.hidden=false;
  setTimeout(()=>location.replace(go),850);
 }catch(error){status.textContent='Очистка выполнена, но новый файл ещё не найден: '+(error?.message||error);open.href=go;open.hidden=false}
})();
</script></body></html>
