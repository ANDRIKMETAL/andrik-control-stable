<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ANDRIK · Лира в игре R1314</title>
<style>:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#070a12;color:#fff}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;background:#121a29;display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:#f3bcb5;text-decoration:none}main{height:calc(100dvh - 172px);position:relative;background:radial-gradient(ellipse at center,#22293c,#070914 75%);touch-action:none}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:12px;left:12px;background:#0b1222dd;padding:10px;border-radius:10px;max-width:80%;font-size:13px}footer{height:114px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;background:#131b2b}button,select{background:#273249;color:white;border:1px solid #52637c;padding:10px;border-radius:8px;font-size:14px}small{font-size:11px;color:#aeb9cf;max-width:100%}@media(max-width:640px){header{font-size:12px}footer{height:146px}main{height:calc(100dvh - 204px)}}</style></head><body><header><a href="/dreaming-of-lira.html?v=r1314">← К игре</a><b>ЛИРА · 3D R1314</b><span>Игровая модель</span></header><main id="stage"><div id="status">Загрузка Лиры...</div></main><footer><select id="motion" aria-label="Действие"><option value="idle">Боевая стойка</option><option value="walk">Ходьба</option><option value="punch">Бокс</option><option value="kick">Удар ногой</option><option value="guitar">Удар гитарой</option><option value="scream">Крик с микрофоном</option></select><button id="reset">Сбросить камеру</button><small>Это именно персонаж Streets / Portrait / Ruins. Поворачивай пальцем. GLB R1312 — отдельный технологический прототип.</small></footer><script type="module">
import * as T from './assets/vendor/three-r170.module.min.js';import {createLyra,poseGuitar} from './assets/lyra-beauty-r1314.js';
const host=document.querySelector('#stage'),status=document.querySelector('#status');let renderer;try{renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});}catch(e){status.textContent='WebGL недоступен: '+e.message;throw e;}renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,.05,100);scene.add(new T.HemisphereLight('#ffffff','#333548',2));const sun=new T.DirectionalLight('#fff0df',2.1);sun.position.set(-3,5,5);scene.add(sun);const rim=new T.DirectionalLight('#ee5b8b',.9);rim.position.set(3,3,-5);scene.add(rim);
const floor=new T.Mesh(new T.CircleGeometry(1.6,50),new T.MeshStandardMaterial({color:'#262e3b',roughness:.9}));floor.rotation.x=-Math.PI/2;scene.add(floor);const lira=createLyra();scene.add(lira);status.textContent='Игровая модель R1314 · вращай пальцем';
let yaw=.2,pitch=.1,dist=3.2,pointer=null,clock=0,last=performance.now();function aim(){const f=new T.Vector3(0,1.20,0);camera.position.set(f.x+Math.sin(yaw)*Math.cos(pitch)*dist,f.y+Math.sin(pitch)*dist,f.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(f);}function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false);}new ResizeObserver(resize).observe(host);resize();aim();host.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY};host.setPointerCapture(e.pointerId);});host.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;yaw-=(e.clientX-pointer.x)*.008;pitch=Math.max(-.45,Math.min(.65,pitch+(e.clientY-pointer.y)*.006));pointer.x=e.clientX;pointer.y=e.clientY;aim()});host.addEventListener('pointerup',()=>pointer=null);host.addEventListener('pointercancel',()=>pointer=null);document.querySelector('#reset').onclick=()=>{yaw=.2;pitch=.1;dist=3.2;aim()};
function play(now){requestAnimationFrame(play);let dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;const u=lira.userData,mode=document.querySelector('#motion').value,cycle=clock%1.3;u.body.position.y=0;u.body.rotation.set(0,0,0);u.head.rotation.set(0,Math.sin(clock*.5)*.02,0);for(const [i,l] of u.limbs.entries()){l.arm.rotation.set(0,0,0);l.fore.rotation.set(0,0,0);l.leg.rotation.set(-.14,0,i?-.07:.07);l.shin.rotation.set(.24,0,0);}
let attack=null;if(mode==='walk'){const s=Math.sin(clock*10);for(const [i,l] of u.limbs.entries()){const v=(i?1:-1)*s;l.leg.rotation.x=v*.45;l.shin.rotation.x=Math.max(0,-v)*.45;l.arm.rotation.x=-v*.30;}}else if(mode==='punch'){attack={kind:'punch',t:cycle,duration:1.3,upper:false};}else if(mode==='kick'){attack={kind:'kick',t:cycle,duration:1.3};const v=Math.sin(Math.PI*cycle/1.3);u.limbs[1].leg.rotation.x=-1.5*v;u.limbs[1].shin.rotation.x=.45*v;u.body.rotation.y=Math.PI*2*cycle/1.3;}else if(mode==='guitar'){attack={kind:'attack',t:cycle,duration:1.3};}else if(mode==='scream'){attack={kind:'scream',t:cycle,duration:1.3};}poseGuitar(lira,attack,1,clock,mode==='walk');renderer.render(scene,camera)}requestAnimationFrame(play);
</script></body></html>
