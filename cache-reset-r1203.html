<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANDRIK R1203 cache reset</title><body style="font-family:system-ui;background:#05080d;color:white;padding:24px"><h1>ANDRIK R1203</h1><p id="s">Очистка кэша…</p><script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('s').textContent='Готово. Открываю сайт…';setTimeout(()=>location.replace('/?r=1203'),500)}catch(e){document.getElementById('s').textContent='Обнови страницу ещё раз: '+e}})()</script></body></html>
