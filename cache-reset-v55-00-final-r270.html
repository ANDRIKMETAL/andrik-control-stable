<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Очистка Control — R270</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050607;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:20px}.box{width:min(92vw,580px);padding:26px;border:1px solid #2f6a56;border-radius:26px;background:#07131c;text-align:center;box-shadow:0 24px 70px #000,0 0 32px rgba(73,255,154,.12)}.badge{display:inline-flex;padding:7px 12px;border:1px solid rgba(111,255,179,.38);border-radius:999px;background:rgba(16,71,48,.45);color:#caffdd;font-weight:900;font-size:.78rem;letter-spacing:.08em}h1{margin:16px 0 8px;font-size:clamp(27px,7vw,42px);line-height:1.08}p{margin:8px auto;color:#b7c9d2;line-height:1.45;max-width:490px}.bar{height:11px;margin:22px 0 15px;border-radius:99px;background:#0b2634;overflow:hidden}.bar span{display:block;width:3%;height:100%;background:linear-gradient(90deg,#4adf93,#8eeeff);transition:width .28s ease}.result{min-height:24px;margin-top:16px;color:#9eb4bf;font-size:.92rem}.result.ok{color:#bfffd9;font-weight:850}.btn{display:none;align-items:center;justify-content:center;width:100%;margin-top:18px;padding:15px 20px;border:1px solid rgba(111,255,179,.45);border-radius:999px;background:#0e4430;color:#e7fff1;text-decoration:none;font-weight:900;font-size:1.04rem}.btn.show{display:flex}</style></head><body><main class="box"><span class="badge">ОЧИСТКА R270</span><h1 id="title">Чистим кэш Control</h1><p>Страница не переходит автоматически. После очистки нажми кнопку.</p><div class="bar"><span id="bar"></span></div><div class="result" id="result">Подготовка…</div><a class="btn" id="open" href="/control-home.html?page=menu&v=55.00-r270">Открыть Control</a></main>
<script>(async()=>{'use strict';const bar=document.getElementById('bar'),result=document.getElementById('result'),title=document.getElementById('title'),open=document.getElementById('open'),stamp=Date.now();let dc=0,dw=0;try{bar.style.width='25%';if('caches'in window){const n=await caches.keys();const r=await Promise.all(n.map(x=>caches.delete(x).catch(()=>false)));dc=r.filter(Boolean).length}bar.style.width='58%';if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations().catch(()=>[]);for(const reg of regs){const u=String(reg.active?.scriptURL||reg.waiting?.scriptURL||reg.installing?.scriptURL||'');if(/OneSignalSDK|\/push\/onesignal\//i.test(u))continue;if(await reg.unregister().catch(()=>false))dw++}}bar.style.width='82%';await fetch('/control-home.html?fresh='+stamp,{cache:'no-store',credentials:'include',headers:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}}).catch(()=>null);bar.style.width='100%';title.textContent='Кэш очищен';result.className='result ok';result.textContent=`Удалено кэшей: ${dc}. Остановлено старых Worker: ${dw}.`;open.href='/control-home.html?page=menu&v=55.00-r270&fresh='+stamp;open.classList.add('show')}catch(e){console.error(e);bar.style.width='100%';title.textContent='Очистка завершена';result.textContent='Часть данных браузера была недоступна. Нажми «Открыть Control».';open.classList.add('show')}})();</script></body></html>
