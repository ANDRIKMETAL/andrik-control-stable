<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R1261 · ADMIN MENU CLEAN</title>
<body style="background:#070b11;color:white;font-family:system-ui;padding:24px">
<h2>R1261 · ADMIN MENU CLEAN</h2><pre id="o">Очистка…</pre>
<script>
(async()=>{
 const o=document.getElementById('o');
 try{
   if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}
   if(window.caches){for(const k of await caches.keys())await caches.delete(k)}
   o.textContent='✅ Кэш очищен. Пункт «Сервер ZIP» убран с главной админки.';
   setTimeout(()=>location.href='/control-home.html?v=55.00-r1261&t='+Date.now(),700)
 }catch(e){o.textContent='❌ '+e.message}
})()
</script></body>
