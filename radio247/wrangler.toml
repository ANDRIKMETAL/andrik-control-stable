name = "andrik-radio-247"
main = "src/index.ts"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PLAYLIST_URL = "https://andrikmetal.com/api/music/downloads"
YOUTUBE_LIVE_URL = "https://www.youtube.com/@andrikmetal/live"
STREAM_COVER_URL = "https://andrikmetal.com/assets/andrik-stream-cover-r565.webp"
STREAM_COVER_FALLBACK_URL = "https://andrikmetal.com/assets/lyra-hero-r563.webp"

[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "radio.andrikmetal.com"
custom_domain = true

[[containers]]
class_name = "AndrikRadio"
image = "./Dockerfile"
max_instances = 1
instance_type = "lite"

[[durable_objects.bindings]]
name = "RADIO"
class_name = "AndrikRadio"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AndrikRadio"]
