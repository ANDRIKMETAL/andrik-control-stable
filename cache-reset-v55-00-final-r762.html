<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ANDRIK R762 — полная очистка кэша</title>
<style>
body{margin:0;background:#05070a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px;line-height:1.45}
.wrap{max-width:720px;margin:auto}.ok{color:#67f59a}.warn{color:#ffd166}.btn{display:inline-block;margin-top:18px;padding:14px 18px;border-radius:12px;background:#fff;color:#05070a;text-decoration:none;font-weight:800}.small{opacity:.72;font-size:14px;white-space:pre-wrap}
</style>
</head>
<body><div class="wrap">
<h2>R762 · полная очистка кэша</h2>
<p id="s">Очищаю Service Worker, Cache Storage, localStorage, sessionStorage и IndexedDB…</p>
<pre id="d" class="small"></pre>
<a id="open" class="btn" href="/?r=762&cache=clean" style="display:none">Открыть ANDRIK заново</a>
</div>
<script>
(async()=>{
  const out=[]; const s=document.getElementById('s'); const d=document.getElementById('d'); const b=document.getElementById('open');
  const note=x=>{out.push(x);d.textContent=out.join('\n')};
  try{
    if('serviceWorker' in navigator){
      try{navigator.serviceWorker.controller?.postMessage({type:'CLEAR_ALL_CACHES'})}catch(_){ }
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){try{await r.unregister()}catch(_){ }}
      note('✅ Service Worker: удалён');
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys){try{await caches.delete(k)}catch(_){ }}
      note(`✅ Cache Storage: удалено ${keys.length}`);
    }
    try{localStorage.clear();note('✅ localStorage: очищен')}catch(_){ }
    try{sessionStorage.clear();note('✅ sessionStorage: очищен')}catch(_){ }
    if(indexedDB && indexedDB.databases){
      try{
        const dbs=await indexedDB.databases();
        for(const db of dbs){if(db?.name){try{indexedDB.deleteDatabase(db.name)}catch(_){ }}}
        note(`✅ IndexedDB: удалено ${dbs.filter(x=>x?.name).length}`);
      }catch(_){ }
    }
    document.cookie.split(';').forEach(c=>{
      const n=c.split('=')[0].trim();
      if(n && /^andrik/i.test(n)) document.cookie=`${n}=;Max-Age=0;path=/;SameSite=Lax`;
    });
    localStorage.setItem('andrik-cache-reset-r762',String(Date.now()));
    s.innerHTML='<span class="ok">✅ R762: браузерный кэш очищен.</span><br>Теперь нажми кнопку ниже. На VPS видеокэш в R762 намеренно не удаляется: это безопасное обновление качества без массовой перекодировки.';
    b.href='/?r=762&t='+Date.now(); b.style.display='inline-block';
  }catch(e){
    s.innerHTML='<span class="warn">⚠️ Очистка выполнена частично.</span>';
    note(String(e)); b.href='/?r=762&t='+Date.now(); b.style.display='inline-block';
  }
})();
</script>
</body>
</html>
