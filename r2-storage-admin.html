<style>

me{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path{font-size:10.5px;color:#718391;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.meta{font-size:11px;color:#9aabba;white-space:nowrap;text-align:right}.badge{font-size:9px;color:#081015;background:var(--gold);padding:2px 5px;border-radius:7px;font-weight:950;margin-left:5px}.actions{display:flex;gap:5px}.iconbtn{width:35px;height:35px;border:1px solid #2b3b49;border-radius:10px;background:#101922;color:#eaf5ff;font-size:16px}.iconbtn.del{color:#ffd8dc;border-color:#573039;background:#211217}.iconbtn:disabled{opacity:.35}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.auth{margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#080e14}.auth summary{cursor:pointer;font-size:12px;color:#92a5b4;font-weight:850}.authrow{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:9px}.auth input{min-height:42px;border:1px solid var(--line);border-radius:11px;background:#0d151d;color:#fff;padding:0 11px}.auth button{border:0;border-radius:11px;background:#1b2d3a;color:#fff;font-weight:850;padding:0 12px}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(7px)}.modal.open{display:grid}.dialog{width:min(500px,100%);border:1px solid #30404e;border-radius:20px;background:#0a1118;padding:16px;box-shadow:0 20px 70px #000}.dialog h2{font-size:18px;margin:0 0 8px}.dialog p{font-size:12px;color:#9babb9;line-height:1.4;word-break:break-all}.dialog input{width:100%;min-height:46px;border:1px solid #334653;border-radius:12px;background:#101922;color:#fff;padding:0 12px;font-size:15px}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.dialog-actions button{min-height:44px;border:0;border-radius:12px;font-weight:900}.cancel{background:#17232d;color:#eaf5ff}.confirm{background:var(--cyan);color:#061017}.confirm.danger{background:#712d38;color:#fff}.note{font-size:11px;color:#7f91a0;margin-top:8px}.toast{position:fixed;z-index:80;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(92vw,520px);padding:10px 14px;border-radius:999px;background:#10231b;border:1px solid #2b6c4a;color:#caffdf;font-size:12px;font-weight:850;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.tools{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:repeat(3,1fr)}.file{grid-template-columns:34px minmax(0,1fr) auto}.ico{width:32px;height:32px}.meta{grid-column:2/3;text-align:left;margin-top:-5px}.actions{grid-column:3/4;grid-row:1/3}.path{max-width:58vw}.iconbtn{width:34px;height:34px}}
</style>
<style id="r926-r2-barrel">
.r2-gauge{margin:12px 0 14px;padding:16px;border:1px solid #253947;border-radius:22px;background:radial-gradient(circle at 35% 12%,rgba(71,214,255,.12),transparent 38%),linear-gradient(145deg,#0b151d,#071018);display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:center;overflow:hidden}

.r2-barrel:before,.r2-barrel:after{content:"";position:absolute;left:-2px;width:calc(100% + 4px);height:27px;border:2px solid rgba(185,232,248,.52);border-radius:50%;z-index:12;pointer-events:none}
.r2-barrel:before{top:-3px;background:radial-gradient(ellipse at 50% 38%,#365666 0,#1b3542 48%,#0e1f29 74%);box-shadow:inset 0 5px 10px #0008}
.r2-barrel:after{bottom:-5px;background:linear-gradient(180deg,transparent,#071119 66%);box-shadow:0 5px 10px #0008}

.r2-liquid:before{content:"";position:absolute;left:-2px;right:-2px;top:-10px;height:20px;border-radius:50%;background:radial-gradient(ellipse at 50% 34%,#d0f9ff 0,#75ecff 18%,#22d3f6 43%,#087da4 82%);box-shadow:0 0 20px rgba(88,226,255,.92),0 0 34px rgba(28,187,232,.42);border:1px solid rgba(199,249,255,.55)}
.r2-liquid:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 8%,rgba(255,255,255,.22) 24%,transparent 39%,rgba(255,255,255,.10) 62%,transparent 77%);opacity:.65}
.r2-liquid-label{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:2;padding:3px 7px;border-radius:999px;background:#001019aa;border:1px solid #8ceeff88;color:#dffbff;font-size:12px;font-weight:950;letter-spacing:.02em;text-shadow:0 1px 3px #000;white-space:nowrap}
.r2-band{position:absolute;left:-3px;right:-3px;height:8px;border-top:1px solid #91b7c5aa;border-bottom:1px solid #051019;background:linear-gradient(#253e4bbb,#0a171ebb);z-index:10;box-shadow:0 2px 5px #0008}.r2-band.b1{top:42px}.r2-band.b2{top:88px}.r2-band.b3{top:134px}
.r2-gauge-copy strong{display:block;font-size:42px;line-height:1;color:#6fe6ff;letter-spacing:-.04em}.r2-gauge-copy b{display:block;margin-top:8px;font-size:17px}.r2-gauge-copy span{display:block;margin-top:5px;color:#9eb0bd;font-size:13px;line-height:1.35}.r2-gauge-copy small{display:block;margin-top:8px;color:#69808f;font-size:11px}.r2-gauge-meter{height:7px;margin-top:12px;border-radius:999px;background:#14242e;overflow:hidden}.r2-gauge-meter i{display:block;height:100%;width:var(--fill);background:linear-gradient(90deg,#0f8fb7,#55ddff);transition:width .65s cubic-bezier(.2,.8,.2,1)}
@media(max-width:560px){.r2-gauge{grid-template-columns:132px minmax(0,1fr);gap:10px;padding:12px}.r2-barrel-scene{height:176px}.r2-barrel{width:105px;height:145px}.r2-barrel:before,.r2-barrel:after{height:22px}.r2-band.b1{top:34px}.r2-band.b2{top:70px}.r2-band.b3{top:106px}.r2-gauge-copy strong{font-size:34px}.r2-gauge-copy b{font-size:14px}.r2-liquid-label{font-size:10px;top:9px}}
</style>
</head><body><main class="wrap">
<div class="top"><button class="back" onclick="history.length>1?history.back():location.assign('/control-home.html')">‹</button><div class="title"><div class="eyebrow">CLOUDFLARE R2 · R926</div><h1>☁️ Хранилище</h1></div></div>
<section class="summary"><div><b id="summary">Загружаю список…</b><br><span id="summary2">Музыка и видео в R2</span></div><button class="refresh" id="refresh">↻ Обновить</button></section>
<section class="r2-gauge" id="r2GaugeR925" style="--fill:0%">
  <div class="r2-barrel-scene" aria-hidden="true"><div class="r2-barrel" id="r2BarrelR926"><div class="r2-liquid" id="r2LiquidR926"><span class="r2-liquid-label" id="r2LiquidLabelR926">0%</span></div><i class="r2-band b1"></i><i class="r2-band b2"></i><i class="r2-band b3"></i></div></div>
  <div class="r2-gauge-copy"><strong id="r2PercentR925">0%</strong><b id="r2UsedR925">0 Б занято</b><span id="r2FreeR925">Загружаю объём R2…</span><small id="r2ScaleR925">Шкала визуализации: 10 ГБ · это не жёсткий лимит R2</small><div class="r2-gauge-meter"><i></i></div></div>
</section>

<div class="tools"><input class="search" id="search" type="search" placeholder="Поиск по точному имени или папке…"><div class="filters"><button class="filter on" data-kind="all">Все</button><button class="filter" data-kind="audio">🎵 Музыка</button><button class="filter" data-kind="video">🎬 Видео</button></div></div>
<div class="state" id="state">—</div><section class="list" id="list"></section>
<details class="auth"><summary>🔐 ADMIN_KEY · только если сессия Control не распознана</summary><div class="authrow"><input id="key" type="password" autocomplete="off" placeholder="ADMIN_KEY"><button id="saveKey">Использовать</button></div></details>
</main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><input id="renameInput" hidden><div class="note" id="modalNote"></div><div class="dialog-actions"><button class="cancel" id="cancel">Отмена</button><button class="confirm" id="confirm">Подтвердить</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const API='/api/control/r2-storage-r922';const KEY_SESSION='andrik-r922-admin-key';let files=[],kind='all',busy=false,pending=null,timer=0;
const $=id=>document.getElementById(id),list=$('list'),state=$('state'),search=$('search'),keyEl=$('key'),modal=$('modal'),renameInput=$('renameInput'),confirmBtn=$('confirm');
try{keyEl.value=sessionStorage.getItem(KEY_SESSION)||''}catch(_){}
function rawKey(){return String(keyEl.value||'').trim()}function headers(extra={}){const k=rawKey();return{accept:'application/json',...(k?{authorization:'Bearer '+k}:{}),...extra}}
async function api(path,opts={}){const r=await fetch(path,{...opts,credentials:'include',cache:'no-store',headers:headers(opts.headers||{})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.message||d.error||('HTTP '+r.status));e.status=r.status;throw e}return d}
function fmt(n){n=Number(n)||0;if(n<1024)return n+' Б';if(n<1024**2)return(n/1024).toFixed(1)+' КБ';if(n<1024**3)return(n/1024**2).toFixed(n>=100*1024**2?0:1)+' МБ';return(n/1024**3).toFixed(2)+' ГБ'}
function updateBarrel(total,scale){total=Math.max(0,Number(total)||0);scale=Math.max(1,Number(scale)||10*1024**3);const pct=Math.min(100,total/scale*100),shown=pct<10?pct.toFixed(1):Math.round(pct).toString(),left=Math.max(0,scale-total),fill=pct+'%';const g=$('r2GaugeR925'),barrel=$('r2BarrelR926'),liquid=$('r2LiquidR926'),label=$('r2LiquidLabelR926');if(g)g.style.setProperty('--fill',fill);if(barrel)barrel.style.setProperty('--fill',fill);if(liquid)liquid.style.height=fill;if(label)label.textContent=shown+'%';const meter=g&&g.querySelector('.r2-gauge-meter i');if(meter)meter.style.width=fill;$('r2PercentR925').textContent=shown+'%';$('r2UsedR925').textContent=fmt(total)+' занято';$('r2FreeR925').textContent=total<=scale?fmt(left)+' свободно по шкале':'Шкала 10 ГБ превышена';$('r2ScaleR925').textContent='Шкала визуализации: '+fmt(scale)+' · это не жёсткий лимит R2'}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function ea(v){return esc(v).replace(/'/g,'&#39;')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('on'),2600)}
function visible(){const q=search.value.trim().toLowerCase();return files.filter(f=>(kind==='all'||f.kind===kind)&&(!q||f.key.toLowerCase().includes(q)||String(f.title||'').toLowerCase().includes(q)))}
function render(){const arr=visible();state.textContent=`Показано ${arr.length} из ${files.length}`;list.innerHTML=arr.map(f=>{const icon=f.kind==='audio'?'🎵':'🎬';const title=f.title&&f.title!==f.name?` · ${esc(f.title)}`:'';const lock=f.protected?`<span class="badge">🔒 СИСТЕМНЫЙ</span>`:'';return `<article class="file"><div class="ico">${icon}</div><div class="main"><div class="name" title="${ea(f.key)}">${esc(f.name)}${lock}</div><div class="path">${esc(f.key)}${title}</div></div><div class="meta">${fmt(f.size)}</div><div class="actions"><button class="iconbtn" data-edit="${ea(f.key)}" title="Переименовать" ${f.protected?'disabled':''}>✏️</button><button class="iconbtn del" data-del="${ea(f.key)}" title="Удалить" ${f.protected?'disabled':''}>🗑</button></div></article>`}).join('')||'<div class="empty">Ничего не найдено.</div>'}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;state.textContent='Читаю R2…';try{const d=await api(API+'?ts='+Date.now());files=d.files||[];const bucketBytes=Number(d.bucketTotalBytes??d.totalBytes)||0,bucketCount=Number(d.bucketObjectCount??files.length)||0,scale=Number(d.displayScaleBytes)||10*1024**3;updateBarrel(bucketBytes,scale);$('summary').textContent=`${bucketCount} объектов · ${fmt(bucketBytes)}`;const a=files.filter(x=>x.kind==='audio').length,v=files.filter(x=>x.kind==='video').length;$('summary2').textContent=`🎵 ${a} · 🎬 ${v} · медиа ${fmt(d.totalBytes)} · точный размер и путь`;render()}catch(e){state.textContent='❌ '+e.message;if(e.status===401)toast('Нужна авторизация Control / ADMIN_KEY')}finally{busy=false;$('refresh').disabled=false}}
function openRename(key){const f=files.find(x=>x.key===key);if(!f||f.protected)return;pending={mode:'rename',file:f};$('modalTitle').textContent='✏️ Переименовать';$('modalText').textContent=f.key;renameInput.hidden=false;renameInput.value=f.name;$('modalNote').textContent='Меняется только имя внутри этой же папки. Расширение сохраняется. Ссылка на старое имя перестанет работать.';confirmBtn.className='confirm';confirmBtn.textContent='Переименовать';modal.classList.add('open');setTimeout(()=>{renameInput.focus();renameInput.select()},60)}
function openDelete(key){const f=files.find(x=>x.key===key);if(!f||f.protected)return;pending={mode:'delete',file:f};$('modalTitle').textContent='🗑 Удалить из R2?';$('modalText').textContent=f.key+' · '+fmt(f.size);renameInput.hidden=true;$('modalNote').textContent='Удаление окончательное. Удаляется только выбранный точный R2-объект.';confirmBtn.className='confirm danger';confirmBtn.textContent='Удалить';modal.classList.add('open')}
function close(){if(busy)return;pending=null;modal.classList.remove('open')}
async function act(){if(!pending||busy)return;busy=true;confirmBtn.disabled=true;const f=pending.file;try{if(pending.mode==='delete'){const d=await api(API+'?key='+encodeURIComponent(f.key),{method:'DELETE'});toast('✅ '+(d.message||'Удалено'))}else{const newName=renameInput.value.trim();if(!newName){renameInput.focus();return}const d=await api(API+'?key='+encodeURIComponent(f.key),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({newName})});toast('✅ '+(d.message||'Переименовано'))}modal.classList.remove('open');pending=null;await load()}catch(e){toast('❌ '+e.message)}finally{busy=false;confirmBtn.disabled=false}}
list.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit)openRename(b.dataset.edit);if(b.dataset.del)openDelete(b.dataset.del)});search.addEventListener('input',render);document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('on',x===b));render()});$('refresh').onclick=load;$('cancel').onclick=close;confirmBtn.onclick=act;modal.addEventListener('click',e=>{if(e.target===modal)close()});$('saveKey').onclick=()=>{try{sessionStorage.setItem(KEY_SESSION,rawKey())}catch(_){}toast('Ключ принят для этой вкладки');load()};
load();
})();
</script></body></html>
