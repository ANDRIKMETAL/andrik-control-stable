space:pre-wrap;word-break:break-all;color:#8fffc8;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.cmd.on{display:block}.list{display:grid;gap:10px;margin-top:16px}.row{padding:13px;border:1px solid #263449;border-radius:15px;background:#080d14}.row strong,.row small{display:block}.row small{margin-top:4px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:10px}.actions button,.actions a{min-height:44px;border-radius:12px;border:1px solid #34465f;background:#111a26;color:#fff;text-decoration:none;font-weight:900;display:flex;align-items:center;justify-content:center;padding:8px 10px}.actions .copy{background:#142c26;border-color:#2d6654}.actions .del{background:#271318;border-color:#68343d}.empty{padding:15px;text-align:center;color:var(--muted);border:1px dashed #34445a;border-radius:14px}@media(max-width:520px){.wrap{padding:8px 8px 24px}.card{padding:14px;border-radius:18px}.head h1{font-size:22px}.actions{grid-template-columns:1fr 1fr}.actions .del{grid-column:1/-1}.top{display:block}.state{margin-top:8px}}

<script>(()=>{'use strict';const $=x=>document.getElementById(x),F=$('file'),U=$('up'),B=$('bar'),M=$('msg'),L=$('list'),S=$('st'),C=$('cmd'),API='/api/control/radio-server-zips-r1258';let rows=[],busy=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n)||0;if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(1)+' КБ';return(n/1048576).toFixed(n>=104857600?0:1)+' МБ'};const dt=v=>{try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch(_){return String(v||'')}};async function api(url,o={}){const r=await fetch(url,{...o,credentials:'include',cache:'no-store',headers:{accept:'application/json','cache-control':'no-cache',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d}async function hash(f){if(!crypto?.subtle||f.size>32*1024*1024)return'';const h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}const q=v=>"'"+String(v).replace(/'/g,"'\\''")+"'";function command(r){const url=new URL(r.downloadUrl||'',location.origin).href,out='/home/ubuntu/'+(r.name||'ANDRIK-RADIO-SERVER.zip');let c=`curl -fL --retry 4 --retry-delay 2 ${q(url)} -o ${q(out)}`;if(r.sha256)c+=` && echo ${q(r.sha256+'  '+out)} | sha256sum -c -`;return c+` && ls -lh ${q(out)}`}async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(_){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}}function render(){L.innerHTML=rows.length?rows.map((r,i)=>`<div class="row"><strong>📦 ${esc(r.name)}</strong><small>${fmt(r.size)} · ${esc(dt(r.uploaded))}${r.sha256?' · SHA256 ✓':''}</small><div class="actions"><button class="copy" data-c="${i}">📋 КОМАНДА VPS</button><a href="${esc(r.downloadUrl||'#')}" download>⬇️ СКАЧАТЬ</a><button class="del" data-d="${i}">🗑 УДАЛИТЬ</button></div></div>`).join(''):'<div class="empty">Серверных ZIP пока нет.</div>'}async function load(){try{S.textContent='R2…';const d=await api(API+'?ts='+Date.now());rows=Array.isArray(d.files)?d.files:[];S.textContent=rows.length+' ZIP';render()}catch(e){S.textContent='ОШИБКА';L.innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'}}function xhr(f,h){return new Promise((ok,bad)=>{const x=new XMLHttpRequest();x.open('PUT',API,true);x.withCredentials=true;x.responseType='json';x.setRequestHeader('content-type','application/zip');x.setRequestHeader('x-andrik-file-name',encodeURIComponent(f.name));x.setRequestHeader('x-andrik-file-size',String(f.size));if(h)x.setRequestHeader('x-andrik-sha256',h);x.upload.onprogress=e=>{if(e.lengthComputable)B.style.width=Math.max(3,Math.min(99,Math.round(e.loaded/e.total*100)))+'%'};x.onerror=()=>bad(new Error('Сеть оборвала загрузку'));x.onload=()=>{const d=x.response||{};x.status>=200&&x.status<300?ok(d):bad(new Error(d.message||d.error||('HTTP '+x.status)))};x.send(f)})}U.onclick=async()=>{const f=F.files?.[0];if(!f)return M.textContent='Выбери ZIP сервера.';if(!/\.zip$/i.test(f.name))return M.textContent='❌ Нужен именно .zip';if(f.size>96*1024*1024)return M.textContent='❌ Максимум 96 МБ';if(busy)return;busy=true;U.disabled=true;B.style.width='2%';C.classList.remove('on');try{M.textContent='Проверяю ZIP…';const h=await hash(f);M.textContent='Выгружаю ZIP → private R2…';const d=await xhr(f,h);B.style.width='100%';F.value='';await load();const r=rows.find(x=>x.key===d.key)||{...d,sha256:h},c=command(r);C.textContent=c;C.classList.add('on');await copy(c);M.textContent='✅ ZIP в R2. Команда VPS скопирована.'}catch(e){B.style.width='0%';M.textContent='❌ '+e.message}finally{busy=false;U.disabled=false}};L.onclick=async e=>{const c=e.target.closest('[data-c]');if(c){const r=rows[+c.dataset.c];if(!r)return;const v=command(r);C.textContent=v;C.classList.add('on');M.textContent=await copy(v)?'✅ Команда VPS скопирована.':'Команда показана ниже.';return}const d=e.target.closest('[data-d]');if(d){const r=rows[+d.dataset.d];if(!r||busy||!confirm('Удалить '+r.name+' из private R2?'))return;busy=true;try{await api(API+'?key='+encodeURIComponent(r.key),{method:'DELETE'});M.textContent='✅ ZIP удалён.';await load()}catch(x){M.textContent='❌ '+x.message}finally{busy=false}}};load()})();</script></body></html>
