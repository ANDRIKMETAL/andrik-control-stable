<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ANDRIK R914 — очистка кэша</title><style>html,body{margin:0;min-height:100%;background:#05090d;color:#edf8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);padding:26px;border:1px solid rgba(94,213,255,.25);border-radius:22px;background:linear-gradient(145deg,#0b141b,#071017);box-shadow:0 0 40px rgba(49,188,255,.08);text-align:center}h1{margin:0 0 10px;font-size:1.55rem}p{margin:8px 0;color:#9db4c4;line-height:1.45}.ok{color:#7ef0b3;font-weight:800}.spin{width:34px;height:34px;margin:18px auto;border:3px solid rgba(255,255,255,.14);border-top-color:#79dcff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{display:inline-flex;margin-top:14px;padding:11px 16px;border-radius:999px;border:1px solid rgba(121,220,255,.3);color:#dff6ff;text-decoration:none;font-weight:800}</style></head><body><main><div class="card"><h1>ANDRIK Control · R914</h1><div id="spin" class="spin"></div><p id="status">Очищаем кэш браузера и обновляем Service Worker…</p><a id="go" href="/youtube-admin.html?v=R914" hidden>Открыть YouTube Studio</a></div></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{r.active&&r.active.postMessage({type:'CLEAR_ALL_CACHES'});await r.update().catch(()=>{})}catch(_){}}}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}try{localStorage.removeItem('andrik-control-cache')}catch(_){}document.getElementById('status').innerHTML='<span class="ok">Готово.</span> R914 будет загружена без старого кэша.'}catch(e){document.getElementById('status').textContent='Очистка завершена настолько, насколько разрешил браузер.'}document.getElementById('spin').style.display='none';document.getElementById('go').hidden=false})()</script></body></html>
