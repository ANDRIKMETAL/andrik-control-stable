<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#080d14"><title>ANDRIK — обновить кэш · R1185</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#080d14;color:#ecece7;font-family:system-ui,sans-serif;padding:24px}.card{width:min(540px,100%);border:1px solid #34414b;background:#101923;padding:28px;border-radius:12px}small{color:#cbb07b;letter-spacing:.15em}h1{font-size:26px;margin:14px 0}p{font-size:16px;line-height:1.6;color:#b4c1cd}nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}a{padding:12px 16px;border:1px solid #536071;border-radius:5px;color:#e2d0ad;text-decoration:none;font-weight:650}.ok{color:#b9d8bb}a:first-child{background:#d0b278;color:#101923;border:0}[hidden]{display:none!important}</style></head><body><main class="card"><small>ANDRIK · R1185</small><h1>Обновление сайта</h1><p id="status" role="status">Очищаем старые файлы…</p><p>Сохранения Dreaming of Líra и вход в контрольку сохраняются.</p><nav id="links" hidden><a href="/dreaming-of-lira.html?v=55.00-r1185">Открыть игру 3D</a><a href="/?v=55.00-r1185">Главная</a><a href="/control-home.html?v=55.00-r1185">Контролька</a></nav><noscript><p>Включи JavaScript, чтобы очистить кэш сайта.</p></noscript></main><script>(async()=>{const s=document.getElementById('status');try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>!/onesignal/i.test(k)).map(k=>caches.delete(k)));}if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.map(async r=>{if(/\/service-worker\.js(?:\?|$)/.test(r.active?.scriptURL||r.waiting?.scriptURL||'')){await r.update();r.waiting?.postMessage({type:'SKIP_WAITING'});}}));}s.className='ok';s.textContent='Готово. Открой игру или главную страницу.';}catch(e){s.textContent='Браузер ограничил очистку. Попробуй открыть страницу в обычном браузере.';}finally{document.getElementById('links').hidden=false;}})();</script></body></html>
