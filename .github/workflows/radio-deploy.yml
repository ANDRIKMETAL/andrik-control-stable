name: ANDRIK Radio - deploy approved release
on:
  push:
    branches: [main]
    paths:
      - ops/radio/release.env
  workflow_dispatch:
    inputs:
      connection_only:
        description: 'Test SSH only, do not deploy or restart radio'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: andrik-radio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify SSH deployment configuration
        env:
          HOST: ${{ secrets.RADIO_SSH_HOST }}
          USER: ${{ secrets.RADIO_SSH_USER }}
          KEY: ${{ secrets.RADIO_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.RADIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY HOST_KEY; do
            test -n "${!v}" || { echo "::error::Missing secret: RADIO_SSH_*"; exit 1; }
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Test SSH connection (no radio changes)
        if: github.event_name == 'workflow_dispatch' && inputs.connection_only
        env:
          HOST: ${{ secrets.RADIO_SSH_HOST }}
          USER: ${{ secrets.RADIO_SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$HOST" 'echo ANDRIK_SSH_CONNECTION_OK && sudo -n /usr/bin/systemctl is-active --quiet andrik-radio.service'
      - name: Apply approved release on VPS
        if: github.event_name != 'workflow_dispatch' || !inputs.connection_only
        env:
          HOST: ${{ secrets.RADIO_SSH_HOST }}
          USER: ${{ secrets.RADIO_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            "$USER@$HOST" \
            'sudo -n /usr/bin/systemctl start andrik-radio-git-deploy.service && sudo -n /usr/bin/systemctl is-active --quiet andrik-radio.service && sudo -n /usr/bin/systemctl show -p Result --value andrik-radio-git-deploy.service | grep -qx success'
