<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110f"><title>ANDRIK · Промо-видео в R2</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123a33 0,#07100f 38%,#020303 100%);color:#eef9f7;padding:18px}.wrap{max-width:620px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.back{color:#a9ddd3;text-decoration:none;font-weight:800}.badge{font-size:.72rem;letter-spacing:.13em;color:#74e6cf}.card{border:1px solid rgba(104,224,199,.28);border-radius:26px;background:rgba(4,12,12,.86);box-shadow:0 18px 50px #0008;padding:20px}.card h1{font-size:1.45rem;margin:0 0 7px}.sub{color:#9bb1ae;margin:0 0 18px;line-height:1.45}.status{padding:12px 14px;border-radius:15px;background:#0a1716;border:1px solid #183b35;margin:12px 0;font-size:.9rem;line-height:1.4}.pick{display:block;border:1px dashed #4bbca6;border-radius:20px;padding:28px 18px;text-align:center;background:#071714;cursor:pointer}.pick strong{display:block;font-size:1.05rem;margin-bottom:5px}.pick span{color:#8fa8a4;font-size:.86rem}input[type=file]{display:none}.key{width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid #244640;background:#06100f;color:#fff}.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:1rem;margin-top:12px;background:linear-gradient(90deg,#45d3b5,#6af0c8);color:#02110d}.btn:disabled{opacity:.45}.progress{height:10px;border-radius:999px;background:#10211e;overflow:hidden;margin-top:15px;display:none}.bar{height:100%;width:0;background:linear-gradient(90deg,#47d5b6,#9af7df);transition:width .15s}.small{color:#7f9692;font-size:.78rem;margin-top:12px}.ok{color:#8ff0d8}.err{color:#ff9494}
</style>
<script defer src="/assets/owner-session-r197.js?v=55.00-r471"></script>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="/control-home.html">← Control</a><span class="badge">R471 · R2 VIDEO</span></div><div class="card">
<h1>Промо Лиры → R2</h1><p class="sub">Загружает MP4 в <b>MUSIC_BUCKET</b> по адресу <code>promo/lyra-trika-2026.mp4</code>. Главная страница сразу начинает использовать собственный плеер без значка YouTube «ИИ».</p>
<div id="current" class="status">Проверяю R2…</div>
<label class="pick" for="file"><strong id="pickTitle">Выбрать готовый MP4</strong><span id="pickSub">Твой ролик 1000377909.mp4 · до 95 МБ</span></label><input id="file" type="file" accept="video/mp4,.mp4">
<input id="key" class="key" type="password" autocomplete="current-password" placeholder="ADMIN_KEY — только если Control попросит">
<button id="upload" class="btn" disabled>ЗАГРУЗИТЬ В R2</button><div id="progress" class="progress"><div id="bar" class="bar"></div></div><div id="msg" class="small">После загрузки обнови главную страницу.</div>
</div></div>
<script>
const $=id=>document.getElementById(id), file=$('file'), btn=$('upload'), msg=$('msg'), current=$('current'), bar=$('bar'), progress=$('progress');
function fmt(n){n=Number(n||0);return n?`${(n/1024/1024).toFixed(1)} МБ`:'0 МБ'}
async function auth(){const k=$('key').value.trim();if(window.AndrikOwnerSession){await window.AndrikOwnerSession.ensure(k||'');return window.AndrikOwnerSession.signedToken?.()||''}return ''}
async function refresh(){try{if(window.AndrikOwnerSession?.ready)await window.AndrikOwnerSession.ready();const r=await fetch('/api/control/media/promo-r471/status',{cache:'no-store'});const d=await r.json();if(r.status===401){current.textContent='Войди в Control или введи ADMIN_KEY ниже.';return}if(d.exists){current.innerHTML=`<span class="ok">Видео уже в R2 ✅</span><br>${fmt(d.size)} · ${d.key}`;}else current.textContent='Видео в R2 ещё не загружено.'}catch(e){current.textContent='Статус R2 будет доступен после входа в Control.'}}
file.onchange=()=>{const f=file.files?.[0];btn.disabled=!f;if(f){$('pickTitle').textContent=f.name;$('pickSub').textContent=fmt(f.size);}};
btn.onclick=async()=>{const f=file.files?.[0];if(!f)return;if(f.size>95*1024*1024){msg.innerHTML='<span class="err">Файл больше 95 МБ.</span>';return}btn.disabled=true;progress.style.display='block';bar.style.width='0%';msg.textContent='Подготавливаю защищённую сессию…';try{const token=await auth();await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT','/api/control/media/promo-r471');x.withCredentials=true;x.setRequestHeader('Content-Type','video/mp4');if(token)x.setRequestHeader('x-andrik-owner-token',token);x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);bar.style.width=p+'%';msg.textContent=`Загрузка в R2: ${p}%`;}};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText||'{}')}catch(_){}if(x.status>=200&&x.status<300&&d.ok){bar.style.width='100%';msg.innerHTML='<span class="ok">Готово! Видео сохранено в R2 ✅ Теперь обнови главную.</span>';resolve()}else reject(new Error(d.message||d.error||`HTTP ${x.status}`))};x.onerror=()=>reject(new Error('Ошибка сети'));x.send(f);});await refresh()}catch(e){msg.innerHTML='<span class="err">'+String(e.message||e)+'</span>'}finally{btn.disabled=false}};
setTimeout(refresh,350);
</script></body></html>
