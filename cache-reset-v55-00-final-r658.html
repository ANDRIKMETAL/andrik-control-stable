<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05070a"><title>ANDRIK R658 cache reset</title><style>body{margin:0;background:#05070a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(560px,100%);padding:24px;border:1px solid #283444;border-radius:20px;background:#0b1016}h2{margin:0 0 10px}p{color:#b8c2ce;line-height:1.5}.ok{color:#72e38d;font-weight:800}.bad{color:#ffb45c}.bar{height:8px;border-radius:999px;background:#1a2531;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:8%;background:#f2c84b;transition:width .25s}</style></head><body><main class="box"><h2>ANDRIK R658 · ПОЛНАЯ ОЧИСТКА</h2><p id="msg">Очищаю Service Worker, Cache Storage, память приложения и IndexedDB…</p><div class="bar"><i id="bar"></i></div></main><script>
(async()=>{
  'use strict';
  const msg=document.getElementById('msg'),bar=document.getElementById('bar');
  const keepLocal={};
  for(const k of ['andrik-comments-admin-key-persistent','andrik-comments-admin-key']){try{const v=localStorage.getItem(k);if(v!==null)keepLocal[k]=v}catch(_){}}
  const keepSession={};
  for(const k of ['andrik-comments-admin-key']){try{const v=sessionStorage.getItem(k);if(v!==null)keepSession[k]=v}catch(_){}}
  try{
    bar.style.width='20%';
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}
    bar.style.width='42%';
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)))}
    bar.style.width='62%';
    try{localStorage.clear();for(const [k,v] of Object.entries(keepLocal))localStorage.setItem(k,v)}catch(_){}
    try{sessionStorage.clear();for(const [k,v] of Object.entries(keepSession))sessionStorage.setItem(k,v)}catch(_){}
    bar.style.width='78%';
    if('indexedDB' in window && typeof indexedDB.databases==='function'){
      const dbs=await indexedDB.databases().catch(()=>[]);
      await Promise.all((dbs||[]).filter(x=>x&&x.name).map(x=>new Promise(resolve=>{try{const q=indexedDB.deleteDatabase(x.name);q.onsuccess=q.onerror=q.onblocked=()=>resolve()}catch(_){resolve()}})));
    }
    bar.style.width='100%';msg.className='ok';msg.textContent='✅ Кэш полностью очищен. Загружаю свежую R658…';
  }catch(e){bar.style.width='100%';msg.className='bad';msg.textContent='Очистка выполнена частично. Всё равно загружаю свежую R658…'}
  await new Promise(r=>setTimeout(r,1500));
  location.replace('/?r=658&t='+Date.now());
})().catch(()=>location.replace('/?r=658&t='+Date.now()));
</script></body></html>
