<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ANDRIK — YouTube</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#fff;font-family:system-ui}
main{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}
.card{width:min(520px,100%);text-align:center}
h1{font-size:24px;margin:0 0 10px}
p{opacity:.72;margin:0 0 18px}
a{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:18px;
background:#e62117;color:#fff;text-decoration:none;font-size:20px;font-weight:900;padding:0 18px}
.small{display:block;margin-top:15px;color:#adb5c2;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ANDRIK METAL RADIO</h1>
    <p>Открыть эфир в YouTube / ReVanced / RVX</p>
    <a id="go" href="https://www.youtube.com/@andrikmetal/live">▶ Открыть эфир</a>
    <span class="small">Если YouTube-клиента нет — откроется веб-версия.</span>
  </div>
</main>
<script>
(()=>{
  const api='/api/public/youtube-live-target';
  const fallback='/radio-live';
  const go=document.getElementById('go');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function videoId(rawUrl){
    try{const u=new URL(rawUrl,location.href),h=u.hostname.toLowerCase();if(h==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(h.endsWith('youtube.com')){const v=u.searchParams.get('v');if(v)return v;const p=u.pathname.split('/').filter(Boolean);if(['live','shorts','embed'].includes(p[0]))return p[1]||''}}catch(_){}return '';
  }
  async function resolveLive(retry=false){
    for(const wait of retry?[0,450,900]:[0]){if(wait)await sleep(wait);try{const r=await fetch(`${api}?fresh=1&ts=${Date.now()}`,{cache:'no-store',headers:{accept:'application/json'}});const d=await r.json().catch(()=>({}));const id=String(d?.videoId||videoId(d?.watchUrl)||'').trim();if(r.ok&&d?.active===true&&id)return {id,url:`https://www.youtube.com/watch?v=${encodeURIComponent(id)}`}}catch(_){}}
    return null;
  }
  function intent(x){return `intent://www.youtube.com/watch?v=${encodeURIComponent(x.id)}#Intent;scheme=https;S.browser_fallback_url=${encodeURIComponent(x.url)};end`}
  go.href=fallback;
  go.addEventListener('click',async e=>{e.preventDefault();go.textContent='Ищу текущий LIVE…';const x=await resolveLive(true);go.textContent='▶ Открыть эфир';if(x){if(/Android/i.test(navigator.userAgent||'')){location.href=intent(x);return}location.href=x.url;return}location.href=fallback});
  resolveLive(false).then(x=>{if(x)go.href=x.url});
})();
</script>
</body>
</html>
