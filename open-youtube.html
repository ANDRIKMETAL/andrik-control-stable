<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>ANDRIK — YouTube</title>
<style>body{font-family:system-ui;background:#05070a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}a{font-size:20px;padding:16px 22px;border:1px solid #465063;border-radius:16px;color:#fff;text-decoration:none}</style></head>
<body><a id="go" href="https://www.youtube.com/@andrikmetal/live">▶ Открыть эфир</a>
<script>
(()=>{const def='https://www.youtube.com/@andrikmetal/live';const allowed=new Set(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be']);let target=def;
try{const u=new URL(new URLSearchParams(location.search).get('target')||def);if(u.protocol==='https:'&&allowed.has(u.hostname.toLowerCase()))target=u.href}catch(_){}
const a=document.getElementById('go');a.href=target;
if(/Android/i.test(navigator.userAgent||'')){a.addEventListener('click',e=>{e.preventDefault();const u=new URL(target);location.href=`intent://${u.host}${u.pathname}${u.search}${u.hash}#Intent;scheme=https;package=by.green.tuber;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=${encodeURIComponent(target)};end`})}
})();
</script></body></html>
