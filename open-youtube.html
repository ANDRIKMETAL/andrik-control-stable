<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ANDRIK — YouTube</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#fff;font-family:system-ui}
main{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}
.card{width:min(520px,100%);text-align:center}
h1{font-size:24px;margin:0 0 10px}
p{opacity:.72;margin:0 0 18px}
a{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:18px;
background:#e62117;color:#fff;text-decoration:none;font-size:20px;font-weight:900;padding:0 18px}
.small{display:block;margin-top:15px;color:#adb5c2;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ANDRIK METAL RADIO</h1>
    <p>Открыть эфир в YouTube / ReVanced / RVX</p>
    <a id="go" href="https://www.youtube.com/@andrikmetal/live">▶ Открыть эфир</a>
    <span class="small">Если YouTube-клиента нет — откроется веб-версия.</span>
  </div>
</main>
<script>
(()=>{
  const fallback='https://www.youtube.com/@andrikmetal/live';
  const allowed=new Set(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be']);

  function videoId(rawUrl){
    try{
      const u=new URL(rawUrl,location.href);
      const host=u.hostname.toLowerCase();
      if(host==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||'';
      if(host.endsWith('youtube.com')){
        const v=u.searchParams.get('v');
        if(v) return v;
        const p=u.pathname.split('/').filter(Boolean);
        if(p[0]==='live'||p[0]==='shorts'||p[0]==='embed') return p[1]||'';
      }
    }catch(_){}
    return '';
  }

  let target=fallback;
  try{
    const raw=new URLSearchParams(location.search).get('target')||fallback;
    const u=new URL(raw);
    if(u.protocol==='https:'&&allowed.has(u.hostname.toLowerCase())) target=u.href;
  }catch(_){}

  const go=document.getElementById('go');
  go.href=target;

  go.addEventListener('click',e=>{
    if(!/Android/i.test(navigator.userAgent||'')) return;
    e.preventDefault();

    const id=videoId(target);
    if(!id){ location.href=target; return; }

    let left=false;
    const mark=()=>{left=true};
    document.addEventListener('visibilitychange',()=>{if(document.hidden)mark()},{once:true});
    window.addEventListener('pagehide',mark,{once:true});
    window.addEventListener('blur',mark,{once:true});

    // Correct format: raw YouTube video id, not the whole https URL.
    location.href=`vnd.youtube:${id}`;

    setTimeout(()=>{
      if(!left&&!document.hidden) location.href=target;
    },1200);
  });
})();
</script>
</body>
</html>
