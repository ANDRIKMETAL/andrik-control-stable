<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ANDRIK — YouTube</title>
<style>
html,body{margin:0;min-height:100%;background:#05070a;color:#fff;font-family:system-ui}
main{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}
.card{width:min(520px,100%);text-align:center}
h1{font-size:24px;margin:0 0 10px}
p{opacity:.72;margin:0 0 18px}
a{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:18px;
background:#e62117;color:#fff;text-decoration:none;font-size:20px;font-weight:900;padding:0 18px}
.small{display:block;margin-top:15px;color:#adb5c2;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ANDRIK METAL RADIO</h1>
    <p>Открыть эфир в YouTube / ReVanced / RVX</p>
    <a id="go" href="https://www.youtube.com/@andrikmetal/live">▶ Открыть эфир</a>
    <span class="small">Если YouTube-клиента нет — откроется веб-версия.</span>
  </div>
</main>
<script>
(()=>{
  const fallback='https://www.youtube.com/@andrikmetal/live';
  const api='/api/public/youtube-live-target';
  const go=document.getElementById('go');
  let target=fallback;

  function videoId(rawUrl){
    try{
      const u=new URL(rawUrl,location.href),host=u.hostname.toLowerCase();
      if(host==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';
      if(host.endsWith('youtube.com')){
        const v=u.searchParams.get('v');if(v)return v;
        const p=u.pathname.split('/').filter(Boolean);if(['live','shorts','embed'].includes(p[0]))return p[1]||'';
      }
    }catch(_){}
    return '';
  }

  async function resolveLive(fresh=true){
    try{
      const r=await fetch(`${api}?fresh=${fresh?'1':'0'}&ts=${Date.now()}`,{cache:'no-store',headers:{accept:'application/json'}});
      const d=await r.json().catch(()=>({}));
      const u=String(d?.watchUrl||'');
      if(r.ok&&d?.active!==false&&videoId(u)){target=u;go.href=u;return u}
    }catch(_){}
    target=fallback;go.href=fallback;return fallback;
  }

  go.addEventListener('click',async e=>{
    e.preventDefault();
    const live=await resolveLive(true);
    const id=videoId(live);
    if(/Android/i.test(navigator.userAgent||'')&&id){
      let left=false;const mark=()=>{left=true};
      document.addEventListener('visibilitychange',()=>{if(document.hidden)mark()},{once:true});
      window.addEventListener('pagehide',mark,{once:true});window.addEventListener('blur',mark,{once:true});
      location.href=`vnd.youtube:${id}`;
      setTimeout(()=>{if(!left&&!document.hidden)location.href=live},1200);
      return;
    }
    location.href=live;
  });
  resolveLive(false);
})();
</script>
</body>
</html>
