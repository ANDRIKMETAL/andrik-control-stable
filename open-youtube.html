<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ANDRIK — YouTube</title>
<style>
html,body{background:#05070a;color:#fff;font-family:system-ui;margin:0;min-height:100%}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
a{display:inline-block;font-size:20px;padding:16px 22px;border:1px solid #465063;border-radius:16px;color:#fff;text-decoration:none}
p{opacity:.72}
</style>
</head>
<body>
<main><div>
<p>Открываем YouTube…</p>
<a id="go" href="https://www.youtube.com/@andrikmetal/live">▶ Открыть эфир</a>
</div></main>
<script>
(()=>{
  const fallback='https://www.youtube.com/@andrikmetal/live';
  const allowed=new Set(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be']);
  let target=fallback;
  try{
    const raw=new URLSearchParams(location.search).get('target')||fallback;
    const u=new URL(raw);
    if(u.protocol==='https:'&&allowed.has(u.hostname.toLowerCase()))target=u.href;
  }catch(_){}

  const go=document.getElementById('go');
  go.href=target;

  function launch(){
    if(!/Android/i.test(navigator.userAgent||'')){
      location.replace(target);
      return;
    }
    const u=new URL(target);
    const intent=`intent://${u.host}${u.pathname}${u.search}${u.hash}#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(target)};end`;
    try{ location.replace(intent); }
    catch(_){ location.replace(target); }
  }

  go.addEventListener('click',e=>{
    if(!/Android/i.test(navigator.userAgent||'')) return;
    e.preventDefault();
    launch();
  });

  setTimeout(launch,30);
})();
</script>
</body>
</html>
