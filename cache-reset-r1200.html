<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANDRIK R1200 cache reset</title><body style="background:#05070a;color:white;font:16px system-ui;padding:24px"><h1>ANDRIK R1200</h1><p id="s">Очистка кэша…</p><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));localStorage.removeItem('andrik-home-cache');document.getElementById('s').textContent='Готово. Открываю сайт…';setTimeout(()=>location.href='/?r=1200&ts='+Date.now(),700)}catch(e){document.getElementById('s').textContent='Ошибка: '+e}})()</script></body>
