<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Полная очистка Control R3U</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050607;color:#eef8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(92vw,540px);padding:28px;border:1px solid #244354;border-radius:26px;background:#07131c;text-align:center;box-shadow:0 24px 70px #000}h1{margin:0 0 12px;font-size:clamp(28px,8vw,42px)}p{color:#a9c0cd;line-height:1.5}.bar{height:10px;margin:18px 0;border-radius:99px;background:#0b2634;overflow:hidden}.bar span{display:block;width:5%;height:100%;background:linear-gradient(90deg,#4adf93,#8eeeff);transition:width .22s ease}.ok{color:#bfffd9}a{display:inline-flex;margin-top:18px;padding:14px 22px;border-radius:999px;background:#0e3448;color:#d9f5ff;text-decoration:none;font-weight:800}</style></head><body><div class="box"><h1>Control R3U</h1><p id="status">Запускаем полную очистку…</p><div class="bar"><span id="bar"></span></div><a id="open" href="/service-admin.html?v=55.00-r3u" hidden>Открыть новую версию</a></div><script>
(async()=>{
 const status=document.getElementById('status'),bar=document.getElementById('bar'),open=document.getElementById('open');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const step=(n,text)=>{status.textContent=n+'/6 · '+text;bar.style.width=(n/6*100)+'%'};
 const stamp=Date.now();
 const go='/service-admin.html?v=55.00-r3u&fresh='+stamp;
 try{
  step(1,'Удаляем все Cache Storage…');
  if('caches'in window){for(const name of await caches.keys())await caches.delete(name).catch(()=>false)}
  await sleep(180);
  step(2,'Отключаем старые Service Worker…');
  if('serviceWorker'in navigator){
   for(const reg of await navigator.serviceWorker.getRegistrations().catch(()=>[])){
    const script=String(reg.active?.scriptURL||reg.waiting?.scriptURL||reg.installing?.scriptURL||'');
    if(/OneSignalSDK|\/push\/onesignal\//i.test(script))continue;
    reg.active?.postMessage?.({type:'CLEAR_ALL_CACHES'});
    reg.waiting?.postMessage?.({type:'CLEAR_ALL_CACHES'});
    await reg.unregister().catch(()=>false);
   }
  }
  await sleep(180);
  step(3,'Удаляем старые локальные версии Control…');
  for(const key of Object.keys(localStorage)){
   if(/andrik-control-(home-last-good|youtube-pane|youtube-monitor|system-cache|runtime-version)/i.test(key))localStorage.removeItem(key);
  }
  for(const key of Object.keys(sessionStorage)){
   if(/andrik-control-(runtime-reload|section-entry|reloaded)/i.test(key))sessionStorage.removeItem(key);
  }
  localStorage.setItem('andrik-control-runtime-version','55.00-r3u');
  await sleep(180);
  step(4,'Проверяем свежие файлы R3U…');
  const required=['/service-admin.html?v=55.00-r3u&probe='+stamp,'/assets/control-section-swipe-v55-00-r3u.js?v=55.00-r3u&probe='+stamp,'/assets/control-cache-reset-v55-00-r3u.js?v=55.00-r3u&probe='+stamp];
  for(const url of required){const response=await fetch(url,{cache:'reload'});if(!response.ok)throw new Error('Файл ещё не опубликован: '+url)}
  await sleep(180);
  step(5,'Подготавливаем чистый запуск…');
  sessionStorage.setItem('andrik-control-runtime-reload-r3u','1');
  await sleep(180);
  step(6,'Готово. Открываем R3U…');
  status.classList.add('ok');open.href=go;open.hidden=false;
  setTimeout(()=>location.replace(go),750);
 }catch(error){
  status.textContent='Очистка завершена частично: '+(error?.message||error);open.href=go;open.hidden=false;
 }
})();
</script></body></html>
