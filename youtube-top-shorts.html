.top-content-page .control-topbar .r553-eye-motion img{position:static!important;inset:auto!important;transform:none!important;width:68px!important;height:68px!important;max-width:68px!important;max-height:68px!important;border-radius:50%!important;object-fit:cover!important;filter:brightness(1.16) saturate(1.35) drop-shadow(0 0 7px rgba(157,255,199,.92)) drop-shadow(0 0 20px rgba(31,255,133,.72))!important}

s span{padding:5px 7px;border-radius:999px;background:rgba(145,208,255,.08);font-size:.7rem;color:#d4ebff}.top-video-open{width:max-content;text-decoration:none;color:#dff3ff;font-weight:900;font-size:.78rem;padding:8px 10px;border-radius:12px;border:1px solid rgba(145,208,255,.18)}.top-loading{padding:24px;border:1px dashed rgba(145,208,255,.18);border-radius:18px;color:#91a7b8;line-height:1.5;text-align:center}.control-version-footer{margin-top:28px}@media(min-width:620px){.top-video{grid-template-columns:116px minmax(0,1fr)}.top-video-thumb{width:116px}}
</style></head><body class="control-page analytics-admin-page top-content-page" data-type="shorts"><nav class="topbar control-topbar"><div class="wrap nav-shell analytics-topbar-minimal"><a class="control-center-logo" href="/youtube-admin.html?v=55.00-r606" aria-label="Назад в YouTube"><span class="r553-eye-halo" aria-hidden="true"></span><span class="r553-eye-motion"><img class="logo-ok" src="/assets/control-topbar-eye-triangle.jpg?v=55.00-r129" alt=""></span></a></div></nav><main class="admin-main"><div class="wrap"><header class="top-content-head"><a class="top-content-back" href="/youtube-admin.html?v=55.00-r606">← YouTube</a><h1 class="top-content-title">🔥 Лучшие Shorts</h1><p class="top-content-sub">Топ-6 Shorts по текущему счётчику просмотров YouTube. Новые ролики попадают сюда без ожидания следующего дня.</p></header><section class="top-content-card"><div class="top-content-list" id="contentList"><div class="top-loading">Загружаем готовый снимок YouTube…</div></div></section><footer class="control-version-footer"><strong>Live Web AI · ANDRIK · версия R606</strong><span>YouTube · текущие просмотры · live refresh</span></footer></div></main><script>(()=>{
  const KEY_SESSION='andrik-comments-admin-key';
  const KEY_LOCAL='andrik-comments-admin-key-persistent';
  const PANE_CACHES=['andrik-control-youtube-pane-v55-00j','andrik-control-youtube-pane-v55-00i','andrik-control-youtube-pane-v55-00h'];
  const PAGE_VERSION='55.00-r606';
  const TYPE=document.body.dataset.type==='shorts'?'shorts':'videos';
  const TOP_CACHE_KEY=`andrik-youtube-top-${TYPE}-r606`;
  const TOP_CACHE_MAX_AGE=5*60*1000;
  const getKey=()=>{try{return localStorage.getItem(KEY_LOCAL)||sessionStorage.getItem(KEY_SESSION)||''}catch(_){return''}};
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const num=v=>new Intl.NumberFormat('ru-RU').format(Math.max(0,Number(v||0)));
  const fmtDate=v=>{try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v))}catch(_){return''}};
  const box=()=>document.getElementById('contentList');

  function normalize(row={}){
    const videoId=String(row.videoId||row.video||'').trim();
    const isShort=TYPE==='shorts';
    return {
      ...row,
      videoId,
      title:String(row.title||`Видео ${videoId}`).trim(),
      views:Math.max(0,Number(row.views||0)),
      likes:Math.max(0,Number(row.likes||0)),
      comments:Math.max(0,Number(row.comments||0)),
      shares:Math.max(0,Number(row.shares||0)),
      publishedAt:String(row.publishedAt||''),
      thumbnail:String(row.thumbnail||''),
      url:String(row.url||(videoId?(isShort?`https://www.youtube.com/shorts/${encodeURIComponent(videoId)}`:`https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`):''))
    };
  }

  function readTopCache(){
    try{
      const cached=JSON.parse(localStorage.getItem(TOP_CACHE_KEY)||'null');
      if(!Array.isArray(cached?.rows)||!cached.rows.length)return [];
      if(Date.now()-Number(cached.savedAt||0)>TOP_CACHE_MAX_AGE)return [];
      return cached.rows.map(normalize).filter(r=>r.videoId).sort((a,b)=>b.views-a.views).slice(0,6);
    }catch(_){return []}
  }
  function saveTopCache(rows,updatedAt=''){
    try{localStorage.setItem(TOP_CACHE_KEY,JSON.stringify({rows:(rows||[]).slice(0,6),savedAt:Date.now(),updatedAt,version:PAGE_VERSION}))}catch(_){}
  }

  function rowsFromStudio(studio={}){
    const direct=TYPE==='shorts'?studio.topShorts28:studio.topRegularVideos28;
    let rows=Array.isArray(direct)?direct:[];
    if(!rows.length && Array.isArray(studio.topVideos28)){
      const wanted=TYPE==='shorts'?'SHORTS':'VIDEO_ON_DEMAND';
      rows=studio.topVideos28.filter(r=>String(r?.creatorContentType||'').toUpperCase()===wanted);
    }
    return rows.map(normalize).filter(r=>r.videoId).sort((a,b)=>b.views-a.views).slice(0,6);
  }

  function rowsFromPayload(data={}){
    return rowsFromStudio(data?.youtube?.studio||data?.studio||{});
  }

  function readCachedPayload(){
    try{
      for(const key of PANE_CACHES){
        const payload=JSON.parse(localStorage.getItem(key)||'null')?.data||null;
        if(payload)return payload;
      }
    }catch(_){ }
    return null;
  }

  function saveCachedPayload(data){
    try{ localStorage.setItem(PANE_CACHES[0], JSON.stringify({data,savedAt:Date.now()})); }catch(_){ }
  }


  function rowsFromTopResponse(data={}){
    const list=(TYPE==='shorts'?data?.shorts:data?.videos)||[];
    return (Array.isArray(list)?list:[]).map(normalize).filter(r=>r.videoId).sort((a,b)=>b.views-a.views).slice(0,6);
  }

  async function trySource(path, extractor, onLoading=''){
    const target=box();
    if(onLoading && target) target.innerHTML=`<div class="top-loading">${esc(onLoading)}</div>`;
    const data=await requestJson(path);
    const rows=extractor(data);
    if(rows.length){
      if(data?.youtube?.studio) saveCachedPayload(data);
      else if(data?.shorts||data?.videos) saveCachedPayload({youtube:{studio:{topShorts28:data.shorts||[],topRegularVideos28:data.videos||[]}}});
      render(rows);
      return true;
    }
    return false;
  }

  function render(rows){
    const target=box(); if(!target)return;
    if(!rows.length){target.innerHTML='<div class="top-loading">За последние 28 дней подходящих роликов в снимке пока нет.</div>';return}
    target.innerHTML=rows.slice(0,6).map((x,i)=>`<article class="top-video">
      ${x.thumbnail?`<img class="top-video-thumb" src="${esc(x.thumbnail)}" alt="" loading="lazy" decoding="async">`:`<div class="top-video-thumb"></div>`}
      <div class="top-video-copy">
        <strong>${esc(x.title||`Видео #${i+1}`)}</strong>
        <p>${[fmtDate(x.publishedAt),`${num(x.views)} просмотров`].filter(Boolean).join(' · ')}</p>
        <div class="top-video-stats"><span>ТОП #${i+1}</span><span>👍 ${num(x.likes)}</span><span>💬 ${num(x.comments)}</span><span>↗ ${num(x.shares)}</span></div>
        ${x.url?`<a class="top-video-open" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть ↗</a>`:''}
      </div>
    </article>`).join('');
  }

  async function waitForOwnerSessionR555(){
    if(document.readyState==='loading'){
      await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
    }
    const owner=window.AndrikOwnerSession;
    if(owner?.ready){
      await owner.ready().catch(()=>null);
    }
    return owner;
  }

  async function requestJson(path){
    const key=getKey();
    const headers={accept:'application/json'};
    // owner-session-r197 stores a sentinel instead of the raw ADMIN_KEY. Never send
    // that sentinel as Bearer auth: the owner-session fetch wrapper adds the signed
    // x-andrik-owner-token / cookie after it has initialized.
    if(key && !/^__ANDRIK_OWNER_SESSION_/i.test(key)) headers.authorization=`Bearer ${key}`;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),22000);
    try{
      const r=await fetch(path,{headers,credentials:'include',cache:'no-store',signal:controller.signal});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
      return d;
    } finally {clearTimeout(timer)}
  }

  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  async function load(){
    const target=box(); if(!target)return;

    // R556: show the last successful top immediately; refresh silently in background.
    const instantRows=readTopCache();
    if(instantRows.length) render(instantRows);
    else target.innerHTML='<div class="top-loading">Получаем актуальный топ YouTube…</div>';

    await waitForOwnerSessionR555();
    if(!getKey() && !window.AndrikOwnerSession?.isActive?.() && !window.AndrikOwnerSession?.signedToken?.()){
      if(!instantRows.length) target.innerHTML='<div class="top-loading">Откройте этот раздел из авторизованного YouTube.</div>';
      return;
    }

    const cached=readCachedPayload();
    const cachedRows=rowsFromPayload(cached||{});
    const seedRows=instantRows.length?instantRows:cachedRows;
    if(!instantRows.length && cachedRows.length){render(cachedRows);saveTopCache(cachedRows)}

    try{
      const data=await requestJson(`/api/control/youtube-top-content?type=${encodeURIComponent(TYPE)}&refresh=1&limit=6&v=${PAGE_VERSION}&t=${Date.now()}`);
      const rows=rowsFromTopResponse(data);
      if(rows.length){
        saveCachedPayload({youtube:{studio:{
          topShorts28:Array.isArray(data?.shorts)?data.shorts:[],
          topRegularVideos28:Array.isArray(data?.videos)?data.videos:[]
        }}});
        saveTopCache(rows,data?.updatedAt||'');
        render(rows);
        return;
      }
      if(seedRows.length){render(seedRows);return}
      target.innerHTML='<div class="top-loading">YouTube пока не вернул ролики этого типа.</div>';
    }catch(error){
      if(seedRows.length){render(seedRows);return}
      target.innerHTML=`<div class="top-loading">Не удалось получить топ YouTube: ${esc(String(error?.message||error||''))}</div>`;
    }
  }

  load();
})();</script></body></html>
