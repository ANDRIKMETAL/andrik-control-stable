</style></head><body class="control-page analytics-admin-page top-content-page" data-type="shorts"><nav class="topbar control-topbar"><div class="wrap nav-shell analytics-topbar-minimal"><a class="control-center-logo" href="/youtube-admin.html?v=55.00-r550" aria-label="Назад в YouTube"><img class="logo-ok" src="/assets/control-topbar-eye-triangle.jpg?v=55.00-r129" alt=""></a></div></nav><main class="admin-main"><div class="wrap"><header class="top-content-head"><a class="top-content-back" href="/youtube-admin.html?v=55.00-r550">← YouTube</a><h1 class="top-content-title">🔥 Лучшие Shorts</h1><p class="top-content-sub">Топ-4 Shorts по просмотрам за последние 28 завершённых дней.</p></header><section class="top-content-card"><div class="top-content-list" id="contentList"><div class="top-loading">Загружаем готовый снимок YouTube…</div></div></section><footer class="control-version-footer"><strong>Live Web AI · ANDRIK · версия R550</strong><span>YouTube Studio · серверный снимок · 28 завершённых дней</span></footer></div></main><script>(()=>{
  const KEY_SESSION='andrik-comments-admin-key';
  const KEY_LOCAL='andrik-comments-admin-key-persistent';
  const PANE_CACHE='andrik-control-youtube-pane-v55-00j';
  const TYPE=document.body.dataset.type==='shorts'?'shorts':'videos';
  const getKey=()=>{try{return localStorage.getItem(KEY_LOCAL)||sessionStorage.getItem(KEY_SESSION)||''}catch(_){return''}};
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const num=v=>new Intl.NumberFormat('ru-RU').format(Math.max(0,Number(v||0)));
  const fmtDate=v=>{try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v))}catch(_){return''}};
  const box=()=>document.getElementById('contentList');

  function normalize(row={}){
    const videoId=String(row.videoId||row.video||'').trim();
    const isShort=TYPE==='shorts';
    return {
      ...row,
      videoId,
      title:String(row.title||`Видео ${videoId}`).trim(),
      views:Math.max(0,Number(row.views||0)),
      likes:Math.max(0,Number(row.likes||0)),
      comments:Math.max(0,Number(row.comments||0)),
      shares:Math.max(0,Number(row.shares||0)),
      publishedAt:String(row.publishedAt||''),
      thumbnail:String(row.thumbnail||''),
      url:String(row.url||(videoId?(isShort?`https://www.youtube.com/shorts/${encodeURIComponent(videoId)}`:`https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`):''))
    };
  }

  function rowsFromStudio(studio={}){
    const direct=TYPE==='shorts'?studio.topShorts28:studio.topRegularVideos28;
    let rows=Array.isArray(direct)?direct:[];
    if(!rows.length && Array.isArray(studio.topVideos28)){
      const wanted=TYPE==='shorts'?'SHORTS':'VIDEO_ON_DEMAND';
      rows=studio.topVideos28.filter(r=>String(r?.creatorContentType||'').toUpperCase()===wanted);
    }
    return rows.map(normalize).filter(r=>r.videoId).sort((a,b)=>b.views-a.views).slice(0,4);
  }

  function rowsFromPayload(data={}){
    return rowsFromStudio(data?.youtube?.studio||{});
  }

  function readCachedPayload(){
    try{return JSON.parse(localStorage.getItem(PANE_CACHE)||'null')?.data||null}catch(_){return null}
  }

  function render(rows){
    const target=box(); if(!target)return;
    if(!rows.length){target.innerHTML='<div class="top-loading">За последние 28 дней подходящих роликов в снимке пока нет.</div>';return}
    target.innerHTML=rows.slice(0,4).map((x,i)=>`<article class="top-video">
      ${x.thumbnail?`<img class="top-video-thumb" src="${esc(x.thumbnail)}" alt="" loading="lazy" decoding="async">`:`<div class="top-video-thumb"></div>`}
      <div class="top-video-copy">
        <strong>${esc(x.title||`Видео #${i+1}`)}</strong>
        <p>${[fmtDate(x.publishedAt),`${num(x.views)} просмотров`].filter(Boolean).join(' · ')}</p>
        <div class="top-video-stats"><span>ТОП #${i+1}</span><span>👍 ${num(x.likes)}</span><span>💬 ${num(x.comments)}</span><span>↗ ${num(x.shares)}</span></div>
        ${x.url?`<a class="top-video-open" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть ↗</a>`:''}
      </div>
    </article>`).join('');
  }

  async function requestJson(path){
    const key=getKey();
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),22000);
    try{
      const r=await fetch(path,{headers:{accept:'application/json',authorization:`Bearer ${key}`},cache:'no-store',signal:controller.signal});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
      return d;
    } finally {clearTimeout(timer)}
  }

  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  async function load(){
    const target=box(); if(!target)return;
    if(!getKey()){target.innerHTML='<div class="top-loading">Откройте этот раздел из авторизованного YouTube.</div>';return}

    // 1) Show an already prepared top instantly when it exists in the working YouTube cache.
    const cached=readCachedPayload();
    const cachedRows=rowsFromPayload(cached||{});
    if(cachedRows.length)render(cachedRows);
    else target.innerHTML='<div class="top-loading">Получаем топ YouTube… Обычно 3–10 секунд.</div>';

    // 2) One focused server request builds the top and returns cards in the SAME request.
    // No more "open the section again" and no dependency on a background warm-up.
    for(let attempt=0;attempt<2;attempt++){
      try{
        const fresh=await requestJson('/api/control/youtube-top-content?refresh=1&v=55.00-r550&t='+Date.now());
        const rows=((TYPE==='shorts'?fresh.shorts:fresh.videos)||[]).map(normalize).filter(r=>r.videoId);
        if(rows.length){render(rows);return}
        if(fresh.error){
          target.innerHTML=`<div class="top-loading">YouTube не вернул список роликов: ${esc(fresh.error)}</div>`;
        }else{
          target.innerHTML='<div class="top-loading">YouTube ответил без подходящих роликов за этот период.</div>';
        }
      }catch(error){
        if(cachedRows.length)return;
        target.innerHTML='<div class="top-loading">YouTube отвечает медленно. Повторяем запрос автоматически…</div>';
      }
      if(attempt===0)await sleep(1800);
    }

    if(!cachedRows.length){
      target.innerHTML='<div class="top-loading">Топ пока не получен. Основная статистика YouTube не затронута.</div>';
    }
  }

  load();
})();</script></body></html>
