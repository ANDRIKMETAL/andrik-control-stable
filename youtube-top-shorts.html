</style></head><body class="control-page analytics-admin-page top-content-page" data-type="shorts"><nav class="topbar control-topbar"><div class="wrap nav-shell analytics-topbar-minimal"><a class="control-center-logo" href="/youtube-admin.html?v=55.00-r552" aria-label="Назад в YouTube"><img class="logo-ok" src="/assets/control-topbar-eye-triangle.jpg?v=55.00-r129" alt=""></a></div></nav><main class="admin-main"><div class="wrap"><header class="top-content-head"><a class="top-content-back" href="/youtube-admin.html?v=55.00-r552">← YouTube</a><h1 class="top-content-title">🔥 Лучшие Shorts</h1><p class="top-content-sub">Топ-4 Shorts по просмотрам за последние 28 завершённых дней.</p></header><section class="top-content-card"><div class="top-content-list" id="contentList"><div class="top-loading">Загружаем готовый снимок YouTube…</div></div></section><footer class="control-version-footer"><strong>Live Web AI · ANDRIK · версия R552</strong><span>YouTube Studio · серверный снимок · 28 завершённых дней</span></footer></div></main><script>(()=>{
  const KEY_SESSION='andrik-comments-admin-key';
  const KEY_LOCAL='andrik-comments-admin-key-persistent';
  const PANE_CACHES=['andrik-control-youtube-pane-v55-00j','andrik-control-youtube-pane-v55-00i','andrik-control-youtube-pane-v55-00h'];
  const PAGE_VERSION='55.00-r552';
  const TYPE=document.body.dataset.type==='shorts'?'shorts':'videos';
  const getKey=()=>{try{return localStorage.getItem(KEY_LOCAL)||sessionStorage.getItem(KEY_SESSION)||''}catch(_){return''}};
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const num=v=>new Intl.NumberFormat('ru-RU').format(Math.max(0,Number(v||0)));
  const fmtDate=v=>{try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v))}catch(_){return''}};
  const box=()=>document.getElementById('contentList');

  function normalize(row={}){
    const videoId=String(row.videoId||row.video||'').trim();
    const isShort=TYPE==='shorts';
    return {
      ...row,
      videoId,
      title:String(row.title||`Видео ${videoId}`).trim(),
      views:Math.max(0,Number(row.views||0)),
      likes:Math.max(0,Number(row.likes||0)),
      comments:Math.max(0,Number(row.comments||0)),
      shares:Math.max(0,Number(row.shares||0)),
      publishedAt:String(row.publishedAt||''),
      thumbnail:String(row.thumbnail||''),
      url:String(row.url||(videoId?(isShort?`https://www.youtube.com/shorts/${encodeURIComponent(videoId)}`:`https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`):''))
    };
  }

  function rowsFromStudio(studio={}){
    const direct=TYPE==='shorts'?studio.topShorts28:studio.topRegularVideos28;
    let rows=Array.isArray(direct)?direct:[];
    if(!rows.length && Array.isArray(studio.topVideos28)){
      const wanted=TYPE==='shorts'?'SHORTS':'VIDEO_ON_DEMAND';
      rows=studio.topVideos28.filter(r=>String(r?.creatorContentType||'').toUpperCase()===wanted);
    }
    return rows.map(normalize).filter(r=>r.videoId).sort((a,b)=>b.views-a.views).slice(0,4);
  }

  function rowsFromPayload(data={}){
    return rowsFromStudio(data?.youtube?.studio||data?.studio||{});
  }

  function readCachedPayload(){
    try{
      for(const key of PANE_CACHES){
        const payload=JSON.parse(localStorage.getItem(key)||'null')?.data||null;
        if(payload)return payload;
      }
    }catch(_){ }
    return null;
  }

  function saveCachedPayload(data){
    try{ localStorage.setItem(PANE_CACHES[0], JSON.stringify({data,savedAt:Date.now()})); }catch(_){ }
  }


  function rowsFromTopResponse(data={}){
    const list=(TYPE==='shorts'?data?.shorts:data?.videos)||[];
    return (Array.isArray(list)?list:[]).map(normalize).filter(r=>r.videoId).sort((a,b)=>b.views-a.views).slice(0,4);
  }

  async function trySource(path, extractor, onLoading=''){
    const target=box();
    if(onLoading && target) target.innerHTML=`<div class="top-loading">${esc(onLoading)}</div>`;
    const data=await requestJson(path);
    const rows=extractor(data);
    if(rows.length){
      if(data?.youtube?.studio) saveCachedPayload(data);
      else if(data?.shorts||data?.videos) saveCachedPayload({youtube:{studio:{topShorts28:data.shorts||[],topRegularVideos28:data.videos||[]}}});
      render(rows);
      return true;
    }
    return false;
  }

  function render(rows){
    const target=box(); if(!target)return;
    if(!rows.length){target.innerHTML='<div class="top-loading">За последние 28 дней подходящих роликов в снимке пока нет.</div>';return}
    target.innerHTML=rows.slice(0,4).map((x,i)=>`<article class="top-video">
      ${x.thumbnail?`<img class="top-video-thumb" src="${esc(x.thumbnail)}" alt="" loading="lazy" decoding="async">`:`<div class="top-video-thumb"></div>`}
      <div class="top-video-copy">
        <strong>${esc(x.title||`Видео #${i+1}`)}</strong>
        <p>${[fmtDate(x.publishedAt),`${num(x.views)} просмотров`].filter(Boolean).join(' · ')}</p>
        <div class="top-video-stats"><span>ТОП #${i+1}</span><span>👍 ${num(x.likes)}</span><span>💬 ${num(x.comments)}</span><span>↗ ${num(x.shares)}</span></div>
        ${x.url?`<a class="top-video-open" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть ↗</a>`:''}
      </div>
    </article>`).join('');
  }

  async function requestJson(path){
    const key=getKey();
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),22000);
    try{
      const r=await fetch(path,{headers:{accept:'application/json',authorization:`Bearer ${key}`},cache:'no-store',signal:controller.signal});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
      return d;
    } finally {clearTimeout(timer)}
  }

  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  async function load(){
    const target=box(); if(!target)return;
    if(!getKey()){
      target.innerHTML='<div class="top-loading">Откройте этот раздел из авторизованного YouTube.</div>';
      return;
    }

    const cached=readCachedPayload();
    const cachedRows=rowsFromPayload(cached||{});
    if(cachedRows.length) render(cachedRows);
    else target.innerHTML='<div class="top-loading">Получаем топ YouTube за 28 дней…</div>';

    try{
      const data=await requestJson(`/api/control/youtube-top-content?type=${encodeURIComponent(TYPE)}&v=${PAGE_VERSION}&t=${Date.now()}`);
      const rows=rowsFromTopResponse(data);
      if(rows.length){
        saveCachedPayload({youtube:{studio:{
          topShorts28:Array.isArray(data?.shorts)?data.shorts:[],
          topRegularVideos28:Array.isArray(data?.videos)?data.videos:[]
        }}});
        render(rows);
        return;
      }
      if(cachedRows.length){
        render(cachedRows);
        return;
      }
      target.innerHTML='<div class="top-loading">За последние 28 завершённых дней YouTube не вернул ролики этого типа.</div>';
    }catch(error){
      if(cachedRows.length){
        render(cachedRows);
        return;
      }
      target.innerHTML=`<div class="top-loading">Не удалось получить топ YouTube: ${esc(String(error?.message||error||''))}</div>`;
    }
  }

  load();
})();</script></body></html>
