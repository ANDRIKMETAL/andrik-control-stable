<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Быстрая очистка — LIVE WEB AI R179</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050607;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:20px}
    .box{width:min(92vw,560px);padding:26px;border:1px solid #2f6a56;border-radius:26px;background:#07131c;text-align:center;box-shadow:0 24px 70px #000,0 0 32px rgba(73,255,154,.12)}
    .badge{display:inline-flex;padding:7px 12px;border:1px solid rgba(111,255,179,.38);border-radius:999px;background:rgba(16,71,48,.45);color:#caffdd;font-weight:900;font-size:.78rem;letter-spacing:.08em}
    h1{margin:16px 0 8px;font-size:clamp(27px,7vw,42px);line-height:1.08}
    p{margin:8px auto;color:#b7c9d2;line-height:1.45;max-width:470px}
    .bar{height:10px;margin:20px 0 12px;border-radius:99px;background:#0b2634;overflow:hidden}
    .bar span{display:block;width:4%;height:100%;background:linear-gradient(90deg,#4adf93,#8eeeff);transition:width .18s ease}
    .ok{color:#bfffd9!important;font-weight:850}
    .btn{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;padding:13px 20px;border:1px solid rgba(111,255,179,.38);border-radius:999px;background:#0e4430;color:#e7fff1;text-decoration:none;font-weight:900}
    .small{font-size:.78rem;color:#718b98;margin-top:12px}
  </style>
</head>
<body>
  <main class="box">
    <span class="badge">БЫСТРАЯ ОЧИСТКА R179</span>
    <h1 id="title">Чистим кэш Control</h1>
    <p id="status">Удаляем старые файлы и сразу возвращаемся в приложение…</p>
    <div class="bar"><span id="bar"></span></div>
    <a class="btn" id="open" href="/control-home.html?page=menu&v=55.00-r179">Открыть Control</a>
    <div class="small">Без ожидания версии Worker и без постоянного окна.</div>
  </main>
<script>
(async()=>{
  'use strict';
  const bar=document.getElementById('bar'),status=document.getElementById('status'),title=document.getElementById('title');
  const stamp=Date.now(),target='/control-home.html?page=menu&v=55.00-r179&fresh='+stamp;
  try{
    bar.style.width='28%';
    if('caches' in window){const names=await caches.keys();await Promise.all(names.map(name=>caches.delete(name).catch(()=>false)))}
    bar.style.width='58%';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations().catch(()=>[]);
      for(const reg of regs){
        const url=String(reg.active?.scriptURL||reg.waiting?.scriptURL||reg.installing?.scriptURL||'');
        if(/OneSignalSDK|\/push\/onesignal\//i.test(url))continue;
        await reg.unregister().catch(()=>false);
      }
    }
    bar.style.width='82%';
    await fetch('/control-home.html?cache-bust='+stamp,{cache:'reload',headers:{'Cache-Control':'no-cache'}}).catch(()=>null);
    bar.style.width='100%';title.textContent='Готово';status.className='ok';status.textContent='Кэш очищен. Открываем Control…';
    document.getElementById('open').href=target;
    setTimeout(()=>location.replace(target),550);
  }catch(error){
    console.error(error);bar.style.width='100%';title.textContent='Кэш очищен';status.textContent='Нажмите «Открыть Control».';
    document.getElementById('open').href=target;
  }
})();
</script>
</body>
</html>
