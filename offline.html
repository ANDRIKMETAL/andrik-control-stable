<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>
(()=>{try{
  const supported=new Set(['ru','uk','sk','en']);
  const root=document.documentElement;
  let page=(root.lang||'ru').toLowerCase().split('-')[0];
  if(location.pathname.endsWith('/player.html')){
    const query=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();
    let saved='';
    try{saved=(localStorage.getItem('andrikPreferredLanguage')||'').toLowerCase()}catch(_){}
    if(supported.has(query)) page=query;
    else if(supported.has(saved)) page=saved;
    root.lang=page;
  }
  let manual='';
  try{manual=(sessionStorage.getItem('andrikManualLanguage')||'').toLowerCase()}catch(_){}
  if(supported.has(page)&&manual===page){
    root.setAttribute('translate','no');
    root.classList.add('notranslate');
    const meta=document.createElement('meta');
    meta.name='google';
    meta.content='notranslate';
    document.head.appendChild(meta);
  }
}catch(_){}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914">
